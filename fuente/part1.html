<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Contrato CCV</title>
<style>
/* ============================================================
   PALETA Y VARIABLES  —  estilo industrial-corporativo sobrio
   ============================================================ */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f5; --surface-3:#e3e8ee;
  --text:#1b2430; --text-2:#5a6676; --text-3:#8a95a5;
  --border:#d5dce4; --border-2:#c2cbd6;
  --accent:#12507e; --accent-2:#1a6ba8; --accent-soft:#e6eff7;
  --focus:#1a6ba8;
  /* estados */
  --st-recibido:#6b7684;      --st-recibido-bg:#e9edf1;
  --st-revision:#1a6ba8;      --st-revision-bg:#e3eefa;
  --st-comentarios:#9a6205;   --st-comentarios-bg:#fdf1dc;
  --st-aprobcom:#4a8a33;      --st-aprobcom-bg:#eaf5e4;
  --st-aprobado:#25703c;      --st-aprobado-bg:#e2f3e8;
  --st-rechazado:#b3261e;     --st-rechazado-bg:#fbe6e4;
  --st-superado:#414a55;      --st-superado-bg:#dfe3e8;
  --ok:#25703c; --warn:#9a6205; --bad:#b3261e;
  --ok-bg:#e2f3e8; --warn-bg:#fdf1dc; --bad-bg:#fbe6e4;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
  --radius:8px; --radius-sm:5px;
  --sidebar-w:288px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#171d25; --surface-2:#1e262f; --surface-3:#26303b;
    --text:#e6ebf1; --text-2:#a3b0be; --text-3:#7d8b9a;
    --border:#2b3541; --border-2:#3a4655;
    --accent:#6fb3e8; --accent-2:#8cc6f5; --accent-soft:#1b2a38;
    --focus:#6fb3e8;
    --st-recibido:#aab5c2;      --st-recibido-bg:#242c35;
    --st-revision:#7ab8ef;      --st-revision-bg:#16283a;
    --st-comentarios:#e0b054;   --st-comentarios-bg:#332a15;
    --st-aprobcom:#96cf7c;      --st-aprobcom-bg:#1e2c1b;
    --st-aprobado:#6fce92;      --st-aprobado-bg:#152c1f;
    --st-rechazado:#f08a80;     --st-rechazado-bg:#331a18;
    --st-superado:#8f9aa7;      --st-superado-bg:#222a33;
    --ok:#6fce92; --warn:#e0b054; --bad:#f08a80;
    --ok-bg:#152c1f; --warn-bg:#332a15; --bad-bg:#331a18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#171d25; --surface-2:#1e262f; --surface-3:#26303b;
  --text:#e6ebf1; --text-2:#a3b0be; --text-3:#7d8b9a;
  --border:#2b3541; --border-2:#3a4655;
  --accent:#6fb3e8; --accent-2:#8cc6f5; --accent-soft:#1b2a38;
  --focus:#6fb3e8;
  --st-recibido:#aab5c2;      --st-recibido-bg:#242c35;
  --st-revision:#7ab8ef;      --st-revision-bg:#16283a;
  --st-comentarios:#e0b054;   --st-comentarios-bg:#332a15;
  --st-aprobcom:#96cf7c;      --st-aprobcom-bg:#1e2c1b;
  --st-aprobado:#6fce92;      --st-aprobado-bg:#152c1f;
  --st-rechazado:#f08a80;     --st-rechazado-bg:#331a18;
  --st-superado:#8f9aa7;      --st-superado-bg:#222a33;
  --ok:#6fce92; --warn:#e0b054; --bad:#f08a80;
  --ok-bg:#152c1f; --warn-bg:#332a15; --bad-bg:#331a18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:var(--accent-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* ============================ LAYOUT ============================ */
.app{display:flex; min-height:100vh}
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  transition:width .18s ease, flex-basis .18s ease;
}
.sidebar.collapsed{width:56px; flex-basis:56px}
.sidebar.collapsed .sb-label,.sidebar.collapsed .sb-brand-text,
.sidebar.collapsed .tree,.sidebar.collapsed .sb-foot{display:none}
.sb-brand{display:flex;align-items:center;gap:10px;padding:14px 14px;border-bottom:1px solid var(--border);min-height:60px}
.sb-mark{width:30px;height:30px;flex:0 0 30px;border-radius:7px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.5px}
:root[data-theme="dark"] .sb-mark,html:not([data-theme="light"]) .sb-mark{color:#0d1219}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .sb-mark{color:#fff}}
.sb-brand-text{min-width:0}
.sb-brand-text b{display:block;font-size:13px;line-height:1.2}
.sb-brand-text span{display:block;font-size:11px;color:var(--text-2)}
.sb-toggle{margin-left:auto;background:none;border:1px solid var(--border);border-radius:6px;
  width:28px;height:28px;cursor:pointer;color:var(--text-2);display:grid;place-items:center}
.sb-toggle:hover{background:var(--surface-2)}
.tree{flex:1;overflow-y:auto;padding:8px 8px 16px}
.sb-foot{padding:10px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}

.node{margin-bottom:2px}
.node-head{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;border-radius:var(--radius-sm);padding:8px 9px;cursor:pointer;
  color:var(--text);font-size:13px;
}
.node-head:hover{background:var(--surface-2)}
.node-head.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.node-head .ico{flex:0 0 16px;display:grid;place-items:center;color:var(--text-2)}
.node-head.active .ico{color:var(--accent)}
.node-head .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{
  flex:0 0 auto;background:var(--surface-3);color:var(--text-2);border-radius:20px;
  padding:1px 7px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
}
.node-head.active .badge{background:var(--accent);color:var(--surface)}
.badge.wip{background:transparent;border:1px dashed var(--border-2);color:var(--text-3);font-weight:500}
.children{margin:2px 0 6px 13px;padding-left:9px;border-left:1px solid var(--border)}
.children .node-head{font-size:12.5px;padding:6px 8px}
.caret{transition:transform .15s ease;color:var(--text-3);flex:0 0 10px;font-size:10px}
.caret.open{transform:rotate(90deg)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:60px;flex-wrap:wrap;
}
.hamb{display:none;background:none;border:1px solid var(--border);border-radius:6px;width:34px;height:34px;cursor:pointer}
.crumb{font-size:12.5px;color:var(--text-2);min-width:0;flex:1}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{margin:0 6px;color:var(--text-3)}
.search{position:relative;flex:0 1 320px}
.search input{
  width:100%;padding:8px 12px 8px 32px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-2);
}
.search .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px}
.search-pop{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);max-height:340px;overflow:auto;z-index:60;
}
.search-pop button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);
  padding:9px 12px;cursor:pointer;font-size:12.5px}
.search-pop button:hover{background:var(--surface-2)}
.search-pop .empty{padding:12px;color:var(--text-2);font-size:12.5px}
.content{padding:20px;flex:1;max-width:1600px;width:100%}

/* ============================ COMPONENTES ============================ */
.page-title{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:0 0 4px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.2px}
h2{font-size:15px;margin:0 0 10px;font-weight:650}
h3{font-size:13px;margin:0 0 8px;font-weight:650;color:var(--text-2);text-transform:uppercase;letter-spacing:.4px}
.sub{color:var(--text-2);font-size:12.5px;margin:0 0 16px;max-width:90ch}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.kpi{padding:14px 15px}
.kpi .k-lab{font-size:11.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.kpi .k-val{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.1}
.kpi .k-note{font-size:11.5px;color:var(--text-3);margin-top:2px}
.kpi.good .k-val{color:var(--ok)} .kpi.warn .k-val{color:var(--warn)} .kpi.bad .k-val{color:var(--bad)}

.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text);
}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1219}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--border)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:4px 8px;font-size:11.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}

label.f{display:block;font-size:11.5px;color:var(--text-2);font-weight:600;margin-bottom:4px}
.inp,select.inp,textarea.inp{
  width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);
}
textarea.inp{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;margin:0 10px 6px 0}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--surface-2);font-weight:650;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;
   color:var(--text-2);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
th .arr{color:var(--text-3);font-size:9px;margin-left:3px}
tbody tr:hover{background:var(--surface-2)}
td.wrap{white-space:normal;min-width:220px}
.num{text-align:right;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.pill.recibido{color:var(--st-recibido);background:var(--st-recibido-bg)}
.pill.revision{color:var(--st-revision);background:var(--st-revision-bg)}
.pill.comentarios{color:var(--st-comentarios);background:var(--st-comentarios-bg)}
.pill.aprobcom{color:var(--st-aprobcom);background:var(--st-aprobcom-bg)}
.pill.aprobado{color:var(--st-aprobado);background:var(--st-aprobado-bg)}
.pill.rechazado{color:var(--st-rechazado);background:var(--st-rechazado-bg)}
.pill.superado{color:var(--st-superado);background:var(--st-superado-bg)}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.neutral{color:var(--text-2);background:var(--surface-3)}
.tag{display:inline-block;background:var(--surface-3);color:var(--text-2);border-radius:4px;padding:1px 6px;font-size:11px;margin-right:4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
a.doclink{color:var(--accent-2);text-decoration:none;border-bottom:1px dotted var(--accent-2)}
a.doclink:hover{text-decoration:none;border-bottom-style:solid}

.help{
  background:var(--accent-soft);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;color:var(--text-2);margin-bottom:14px;
}
.help b{color:var(--text)}
.hint{
  display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;
  border:1px solid var(--border-2);color:var(--text-3);font-size:10px;font-weight:700;cursor:help;flex:0 0 15px;
}
.warnbox{background:var(--warn-bg);border:1px solid var(--border);border-left:3px solid var(--warn);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.badbox{background:var(--bad-bg);border:1px solid var(--border);border-left:3px solid var(--bad);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.empty-state{padding:36px 20px;text-align:center;color:var(--text-2)}
.empty-state .big{font-size:28px;margin-bottom:8px;opacity:.5}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:100;display:flex;align-items:flex-start;
  justify-content:center;padding:24px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  width:100%;max-width:900px;margin:auto}
.modal.narrow{max-width:560px}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;z-index:2}
.modal-head h2{margin:0;flex:1;font-size:15px}
.modal-body{padding:18px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--text-2);padding:2px 6px}

/* timeline */
.timeline{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid var(--border)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-30px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);
  border:3px solid var(--accent)}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tl-rev{font-weight:700;font-size:13px}

/* fichas / definiciones */
.dl{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:6px 14px;font-size:12.5px;align-items:baseline}
.dl dt{color:var(--text-2);font-weight:600}
.dl dd{margin:0}
.sec{border-top:1px solid var(--border);margin-top:16px;padding-top:14px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}

/* graficos */
.chart{width:100%;max-width:660px;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}


/* guía didáctica */
.plano-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:6px;max-height:80vh}
.plano{display:block;width:100%;height:auto;max-width:none}
a.btn{text-decoration:none}
.pasos{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pasos li{display:flex;gap:10px;font-size:12.5px;border:1px solid var(--border);border-radius:6px;padding:10px;line-height:1.5}
.pnum{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
:root[data-theme="dark"] .pnum{color:#0d1219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pnum{color:#0d1219}}
details.acc{border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:6px}
details.acc summary{cursor:pointer;font-weight:600;font-size:13px}
details.acc summary::marker{color:var(--text-3)}

/* barra carpeta */
.fsbar{background:var(--warn-bg);border-bottom:1px solid var(--border);padding:8px 20px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fsbar b{color:var(--text)}
.fsbar[hidden]{display:none}
/* modo lectura / simuladores */
body.lectura .solo-admin{display:none!important}
#adminBtn.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sim-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.sim-card{display:flex;flex-direction:column;gap:8px;padding:16px}
.sim-card .sim-ico{font-size:28px}
.sim-card h2{margin:0}
.sim-card p{margin:0;font-size:12.5px;color:var(--text-2)}
.sim-card .sim-src{font-size:11.5px;color:var(--text-3)}
.sim-card .toolbar{margin:auto 0 0}
.sim-frame{width:100%;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
/* toast */
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:10px 14px;font-size:12.5px;max-width:340px}
.toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}

/* wip */
.wip-card{padding:22px}
.wip-card .wip-ico{font-size:26px;opacity:.5}
.wip-list{margin:10px 0 0;padding-left:18px;color:var(--text-2);font-size:12.5px}
.wip-list li{margin-bottom:4px}

@media (max-width:860px){
  .sidebar{position:fixed;z-index:80;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .hamb{display:grid;place-items:center}
  .content{padding:14px}
  .topbar{padding:10px 14px}
  .search{flex:1 1 100%;order:3}
  .dl{grid-template-columns:1fr}
  .dl dt{margin-top:6px}
}
@media print{.sidebar,.topbar,.toolbar,#toasts{display:none!important}.content{padding:0}}
</style>
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-mark">OT</div>
      <div class="sb-brand-text">
        <b>Control de Contrato</b>
        <span id="sbSubtitle">Oficina Técnica y Calidad</span>
      </div>
      <button class="sb-toggle" id="sbToggle" title="Colapsar menú" aria-label="Colapsar menú">‹</button>
    </div>
    <nav class="tree" id="tree" aria-label="Menú principal"></nav>
    <div class="sb-foot">
      <div id="sbFoot">—</div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button class="hamb" id="hamb" aria-label="Abrir menú">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="search">
        <span class="mag">⌕</span>
        <input id="globalSearch" type="search" placeholder="Buscar por código, título o disciplina…"
