<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de Contrato CCV</title>
<style>
/* ============================================================
   PALETA Y VARIABLES  —  estilo industrial-corporativo sobrio
   ============================================================ */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f5; --surface-3:#e3e8ee;
  --text:#1b2430; --text-2:#5a6676; --text-3:#8a95a5;
  --border:#d5dce4; --border-2:#c2cbd6;
  --accent:#12507e; --accent-2:#1a6ba8; --accent-soft:#e6eff7;
  --focus:#1a6ba8;
  /* estados */
  --st-recibido:#6b7684;      --st-recibido-bg:#e9edf1;
  --st-revision:#1a6ba8;      --st-revision-bg:#e3eefa;
  --st-comentarios:#9a6205;   --st-comentarios-bg:#fdf1dc;
  --st-aprobcom:#4a8a33;      --st-aprobcom-bg:#eaf5e4;
  --st-aprobado:#25703c;      --st-aprobado-bg:#e2f3e8;
  --st-rechazado:#b3261e;     --st-rechazado-bg:#fbe6e4;
  --st-superado:#414a55;      --st-superado-bg:#dfe3e8;
  --ok:#25703c; --warn:#9a6205; --bad:#b3261e;
  --ok-bg:#e2f3e8; --warn-bg:#fdf1dc; --bad-bg:#fbe6e4;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.06);
  --radius:8px; --radius-sm:5px;
  --sidebar-w:288px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#171d25; --surface-2:#1e262f; --surface-3:#26303b;
    --text:#e6ebf1; --text-2:#a3b0be; --text-3:#7d8b9a;
    --border:#2b3541; --border-2:#3a4655;
    --accent:#6fb3e8; --accent-2:#8cc6f5; --accent-soft:#1b2a38;
    --focus:#6fb3e8;
    --st-recibido:#aab5c2;      --st-recibido-bg:#242c35;
    --st-revision:#7ab8ef;      --st-revision-bg:#16283a;
    --st-comentarios:#e0b054;   --st-comentarios-bg:#332a15;
    --st-aprobcom:#96cf7c;      --st-aprobcom-bg:#1e2c1b;
    --st-aprobado:#6fce92;      --st-aprobado-bg:#152c1f;
    --st-rechazado:#f08a80;     --st-rechazado-bg:#331a18;
    --st-superado:#8f9aa7;      --st-superado-bg:#222a33;
    --ok:#6fce92; --warn:#e0b054; --bad:#f08a80;
    --ok-bg:#152c1f; --warn-bg:#332a15; --bad-bg:#331a18;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#171d25; --surface-2:#1e262f; --surface-3:#26303b;
  --text:#e6ebf1; --text-2:#a3b0be; --text-3:#7d8b9a;
  --border:#2b3541; --border-2:#3a4655;
  --accent:#6fb3e8; --accent-2:#8cc6f5; --accent-soft:#1b2a38;
  --focus:#6fb3e8;
  --st-recibido:#aab5c2;      --st-recibido-bg:#242c35;
  --st-revision:#7ab8ef;      --st-revision-bg:#16283a;
  --st-comentarios:#e0b054;   --st-comentarios-bg:#332a15;
  --st-aprobcom:#96cf7c;      --st-aprobcom-bg:#1e2c1b;
  --st-aprobado:#6fce92;      --st-aprobado-bg:#152c1f;
  --st-rechazado:#f08a80;     --st-rechazado-bg:#331a18;
  --st-superado:#8f9aa7;      --st-superado-bg:#222a33;
  --ok:#6fce92; --warn:#e0b054; --bad:#f08a80;
  --ok-bg:#152c1f; --warn-bg:#332a15; --bad-bg:#331a18;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
a{color:var(--accent-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* ============================ LAYOUT ============================ */
.app{display:flex; min-height:100vh}
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  transition:width .18s ease, flex-basis .18s ease;
}
.sidebar.collapsed{width:56px; flex-basis:56px}
.sidebar.collapsed .sb-label,.sidebar.collapsed .sb-brand-text,
.sidebar.collapsed .tree,.sidebar.collapsed .sb-foot{display:none}
.sb-brand{display:flex;align-items:center;gap:10px;padding:14px 14px;border-bottom:1px solid var(--border);min-height:60px}
.sb-mark{width:30px;height:30px;flex:0 0 30px;border-radius:7px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:12px;letter-spacing:.5px}
:root[data-theme="dark"] .sb-mark,html:not([data-theme="light"]) .sb-mark{color:#0d1219}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .sb-mark{color:#fff}}
.sb-brand-text{min-width:0}
.sb-brand-text b{display:block;font-size:13px;line-height:1.2}
.sb-brand-text span{display:block;font-size:11px;color:var(--text-2)}
.sb-toggle{margin-left:auto;background:none;border:1px solid var(--border);border-radius:6px;
  width:28px;height:28px;cursor:pointer;color:var(--text-2);display:grid;place-items:center}
.sb-toggle:hover{background:var(--surface-2)}
.tree{flex:1;overflow-y:auto;padding:8px 8px 16px}
.sb-foot{padding:10px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}

.node{margin-bottom:2px}
.node-head{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:none;border:0;border-radius:var(--radius-sm);padding:8px 9px;cursor:pointer;
  color:var(--text);font-size:13px;
}
.node-head:hover{background:var(--surface-2)}
.node-head.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.node-head .ico{flex:0 0 16px;display:grid;place-items:center;color:var(--text-2)}
.node-head.active .ico{color:var(--accent)}
.node-head .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{
  flex:0 0 auto;background:var(--surface-3);color:var(--text-2);border-radius:20px;
  padding:1px 7px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
}
.node-head.active .badge{background:var(--accent);color:var(--surface)}
.badge.wip{background:transparent;border:1px dashed var(--border-2);color:var(--text-3);font-weight:500}
.children{margin:2px 0 6px 13px;padding-left:9px;border-left:1px solid var(--border)}
.children .node-head{font-size:12.5px;padding:6px 8px}
.caret{transition:transform .15s ease;color:var(--text-3);flex:0 0 10px;font-size:10px}
.caret.open{transform:rotate(90deg)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:60px;flex-wrap:wrap;
}
.hamb{display:none;background:none;border:1px solid var(--border);border-radius:6px;width:34px;height:34px;cursor:pointer}
.crumb{font-size:12.5px;color:var(--text-2);min-width:0;flex:1}
.crumb b{color:var(--text);font-weight:600}
.crumb .sep{margin:0 6px;color:var(--text-3)}
.search{position:relative;flex:0 1 320px}
.search input{
  width:100%;padding:8px 12px 8px 32px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface-2);
}
.search .mag{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:13px}
.search-pop{
  position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);max-height:340px;overflow:auto;z-index:60;
}
.search-pop button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);
  padding:9px 12px;cursor:pointer;font-size:12.5px}
.search-pop button:hover{background:var(--surface-2)}
.search-pop .empty{padding:12px;color:var(--text-2);font-size:12.5px}
.content{padding:20px;flex:1;max-width:1600px;width:100%}

/* ============================ COMPONENTES ============================ */
.page-title{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin:0 0 4px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.2px}
h2{font-size:15px;margin:0 0 10px;font-weight:650}
h3{font-size:13px;margin:0 0 8px;font-weight:650;color:var(--text-2);text-transform:uppercase;letter-spacing:.4px}
.sub{color:var(--text-2);font-size:12.5px;margin:0 0 16px;max-width:90ch}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.cols2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.kpi{padding:14px 15px}
.kpi .k-lab{font-size:11.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.kpi .k-val{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:6px;line-height:1.1}
.kpi .k-note{font-size:11.5px;color:var(--text-3);margin-top:2px}
.kpi.good .k-val{color:var(--ok)} .kpi.warn .k-val{color:var(--warn)} .kpi.bad .k-val{color:var(--bad)}

.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 12px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text);
}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0d1219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0d1219}}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--border)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:4px 8px;font-size:11.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}

label.f{display:block;font-size:11.5px;color:var(--text-2);font-weight:600;margin-bottom:4px}
.inp,select.inp,textarea.inp{
  width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--surface);
}
textarea.inp{min-height:70px;resize:vertical}
.field{margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;margin:0 10px 6px 0}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;white-space:nowrap}
th{background:var(--surface-2);font-weight:650;font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;
   color:var(--text-2);position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
th .arr{color:var(--text-3);font-size:9px;margin-left:3px}
tbody tr:hover{background:var(--surface-2)}
td.wrap{white-space:normal;min-width:220px}
.num{text-align:right;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.pill.recibido{color:var(--st-recibido);background:var(--st-recibido-bg)}
.pill.revision{color:var(--st-revision);background:var(--st-revision-bg)}
.pill.comentarios{color:var(--st-comentarios);background:var(--st-comentarios-bg)}
.pill.aprobcom{color:var(--st-aprobcom);background:var(--st-aprobcom-bg)}
.pill.aprobado{color:var(--st-aprobado);background:var(--st-aprobado-bg)}
.pill.rechazado{color:var(--st-rechazado);background:var(--st-rechazado-bg)}
.pill.superado{color:var(--st-superado);background:var(--st-superado-bg)}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.neutral{color:var(--text-2);background:var(--surface-3)}
.tag{display:inline-block;background:var(--surface-3);color:var(--text-2);border-radius:4px;padding:1px 6px;font-size:11px;margin-right:4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
a.doclink{color:var(--accent-2);text-decoration:none;border-bottom:1px dotted var(--accent-2)}
a.doclink:hover{text-decoration:none;border-bottom-style:solid}

.help{
  background:var(--accent-soft);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;color:var(--text-2);margin-bottom:14px;
}
.help b{color:var(--text)}
.hint{
  display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;
  border:1px solid var(--border-2);color:var(--text-3);font-size:10px;font-weight:700;cursor:help;flex:0 0 15px;
}
.warnbox{background:var(--warn-bg);border:1px solid var(--border);border-left:3px solid var(--warn);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.badbox{background:var(--bad-bg);border:1px solid var(--border);border-left:3px solid var(--bad);
  border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.empty-state{padding:36px 20px;text-align:center;color:var(--text-2)}
.empty-state .big{font-size:28px;margin-bottom:8px;opacity:.5}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:100;display:flex;align-items:flex-start;
  justify-content:center;padding:24px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);
  width:100%;max-width:900px;margin:auto}
.modal.narrow{max-width:560px}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;z-index:2}
.modal-head h2{margin:0;flex:1;font-size:15px}
.modal-body{padding:18px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--border);
  position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--text-2);padding:2px 6px}

/* timeline */
.timeline{position:relative;margin-left:8px;padding-left:22px;border-left:2px solid var(--border)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-30px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);
  border:3px solid var(--accent)}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.tl-rev{font-weight:700;font-size:13px}

/* fichas / definiciones */
.dl{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:6px 14px;font-size:12.5px;align-items:baseline}
.dl dt{color:var(--text-2);font-weight:600}
.dl dd{margin:0}
.sec{border-top:1px solid var(--border);margin-top:16px;padding-top:14px}
.sec:first-child{border-top:0;margin-top:0;padding-top:0}

/* graficos */
.chart{width:100%;max-width:660px;height:auto;display:block;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11.5px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}


/* guía didáctica */
.plano-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:6px;max-height:80vh}
.plano{display:block;width:100%;height:auto;max-width:none}
a.btn{text-decoration:none}
.pasos{list-style:none;margin:0;padding:0;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.pasos li{display:flex;gap:10px;font-size:12.5px;border:1px solid var(--border);border-radius:6px;padding:10px;line-height:1.5}
.pnum{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
:root[data-theme="dark"] .pnum{color:#0d1219}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pnum{color:#0d1219}}
details.acc{border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:6px}
details.acc summary{cursor:pointer;font-weight:600;font-size:13px}
details.acc summary::marker{color:var(--text-3)}

/* barra carpeta */
.fsbar{background:var(--warn-bg);border-bottom:1px solid var(--border);padding:8px 20px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fsbar b{color:var(--text)}
.fsbar[hidden]{display:none}
/* modo lectura / simuladores */
body.lectura .solo-admin{display:none!important}
#adminBtn.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sim-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.sim-card{display:flex;flex-direction:column;gap:8px;padding:16px}
.sim-card .sim-ico{font-size:28px}
.sim-card h2{margin:0}
.sim-card p{margin:0;font-size:12.5px;color:var(--text-2)}
.sim-card .sim-src{font-size:11.5px;color:var(--text-3)}
.sim-card .toolbar{margin:auto 0 0}
/* módulo 05: carta Gantt, avance, informe */
.gantt{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);overflow:auto;max-height:calc(100vh - 120px);scrollbar-width:thin}
.g-row{display:flex;width:max-content;min-width:100%}
.g-row.g-head{position:sticky;top:0;z-index:4}
.g-izq{position:sticky;left:0;z-index:2;flex:0 0 380px;width:380px;background:var(--surface);border-right:1px solid var(--border);box-sizing:border-box}
.g-row.g-res .g-izq{background:var(--surface-2)}
.g-der{flex:0 0 auto}
.g-cab{background:var(--surface-2);border-bottom:1px solid var(--border);height:34px;display:flex;align-items:center;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.3px;color:var(--text-2);padding:0 10px;white-space:nowrap;box-sizing:border-box}
.g-izq.g-cab{z-index:5}
.g-der.g-cab{padding:0;flex-wrap:wrap;height:auto;min-height:34px;align-items:stretch}
.g-mes{border-right:1px solid var(--border);text-align:center;font-size:11px;padding:3px 0 2px;box-sizing:border-box;text-transform:none;letter-spacing:0;flex:0 0 auto}
.g-semanas{display:flex;width:100%;border-top:1px solid var(--border)}
.g-sem{border-right:1px solid var(--border);text-align:center;font-size:9.5px;font-weight:500;color:var(--text-3);box-sizing:border-box;flex:0 0 auto}
.g-fila{height:34px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);cursor:pointer;font-size:12.5px;white-space:nowrap;overflow:hidden;padding-right:8px}
.g-row:hover .g-izq,.g-row:hover .g-linea{background-color:var(--surface-3)}
.g-row.g-res .g-fila{font-weight:650}
.g-tog{flex:0 0 16px;width:16px;height:16px;border:1px solid var(--border-2);border-radius:3px;background:var(--surface);font-size:11px;line-height:1;cursor:pointer;padding:0;color:var(--text-2)}
.g-row:not(.g-res) .g-tog{border:0;background:none}
.g-nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.g-sub{flex:0 0 auto;font-size:10.5px;color:var(--text-3);font-weight:400}
.g-linea{position:relative;height:34px;border-bottom:1px solid var(--border);cursor:pointer;background-image:linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:90px 100%}
.g-barra{position:absolute;top:9px;height:16px;border-radius:3px;border:1px solid;box-sizing:border-box;overflow:hidden}
.g-barra.g-resumen{top:12px;height:8px;border:0;border-radius:2px}
.g-barra.g-crit{outline:2px solid var(--bad);outline-offset:1px}
.g-real{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.35)}
.g-resumen .g-real{background:rgba(255,255,255,.55)}
.g-pct{position:absolute;left:5px;top:0;line-height:14px;font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.6)}
.g-hito{position:absolute;top:11px;width:10px;height:10px;transform:rotate(45deg);border:2px solid;background:var(--surface);box-sizing:border-box}
.g-corte{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--bad);z-index:1;pointer-events:none}
.pbar{position:relative;width:90px;height:14px;background:var(--surface-3);border-radius:3px;overflow:hidden;font-size:10.5px;line-height:14px}
.pbar div{position:absolute;left:0;top:0;bottom:0}
.pbar span{position:relative;padding-left:5px;color:var(--text);font-weight:600}
.informe h3{margin-top:0}
.inf-cab{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:2px solid var(--accent);padding-bottom:10px}
.informe table{width:100%}
.informe .sec{margin-top:14px;padding-top:12px}
@media print{.no-print,.help,.sidebar,.topbar,.toolbar,.fsbar{display:none!important}.content{padding:0}.card{box-shadow:none;border:0}.informe .card{border:0}body{background:#fff}}
/* explorador de carpeta de calidad (Drive) */
.migas{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;margin:0 0 10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm)}
.migas a{text-decoration:none;color:var(--accent-2)}
.migas a:hover{text-decoration:underline}
.migas .sep{color:var(--text-3)}
.drv-row{cursor:pointer}
.drv-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.drv-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;cursor:pointer;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px}
.drv-card:hover{background:var(--surface-2);border-color:var(--border-2)}
.drv-ico{font-size:30px;line-height:1}
.drv-nom{font-size:12.5px;font-weight:600;word-break:break-word;line-height:1.3}
.drv-sub{font-size:11px;color:var(--text-3);line-height:1.3}
.modal.wide{max-width:min(1400px,96vw)}
.visor-doc{width:100%;height:calc(100vh - 190px);min-height:480px;border:0;display:block;background:#fff}
.drive-frame{width:100%;height:calc(100vh - 260px);min-height:480px;border:0;display:block;background:#fff}
.sim-frame{width:100%;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
/* toast */
#toasts{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:10px 14px;font-size:12.5px;max-width:340px}
.toast.bad{border-left-color:var(--bad)} .toast.ok{border-left-color:var(--ok)}

/* wip */
.wip-card{padding:22px}
.wip-card .wip-ico{font-size:26px;opacity:.5}
.wip-list{margin:10px 0 0;padding-left:18px;color:var(--text-2);font-size:12.5px}
.wip-list li{margin-bottom:4px}

@media (max-width:860px){
  .g-izq{flex-basis:230px;width:230px}
  .sidebar{position:fixed;z-index:80;left:0;top:0;transform:translateX(-100%);box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .hamb{display:grid;place-items:center}
  .content{padding:14px}
  .topbar{padding:10px 14px}
  .search{flex:1 1 100%;order:3}
  .dl{grid-template-columns:1fr}
  .dl dt{margin-top:6px}
}
@media print{.sidebar,.topbar,.toolbar,#toasts{display:none!important}.content{padding:0}}

let ALMACEN_OK = true;

function cargarDB(){
  let crudo = null;
  try { crudo = localStorage.getItem(APP.storageKey); }
  catch(e){ ALMACEN_OK = false; console.warn('localStorage no disponible:', e); }

  if(!crudo){ DB = dbVacia(); DB.documentos = datosDeEjemplo(); DB.correlativo = DB.documentos.length + 1; guardarDB(); return; }

  try{
    const obj = JSON.parse(crudo);
    DB = normalizarDB(obj);
  }catch(e){
    console.warn('Datos guardados ilegibles, se parte de cero:', e);
    DB = dbVacia(); DB.documentos = datosDeEjemplo(); DB.correlativo = DB.documentos.length + 1;
  }
}

function guardarDB(){
  try{ localStorage.setItem(APP.storageKey, JSON.stringify(DB)); }
  catch(e){
    if(ALMACEN_OK){ ALMACEN_OK = false; toast('No se pudo guardar en este navegador. Los cambios existen solo mientras la pestaña esté abierta: exporte un respaldo JSON.', 'bad', 9000); }
    console.warn('Error al guardar:', e);
  }
}

/* Rellena campos faltantes de una base importada o antigua */
function normalizarDB(obj){
  const base = dbVacia();
  const db = {
    contrato: Object.assign(contratoPorDefecto(), (obj && obj.contrato) || {}),
    params:   Object.assign(paramsPorDefecto(),   (obj && obj.params)   || {}),
    correlativo: (obj && Number(obj.correlativo)) || 1,
    documentos: Array.isArray(obj && obj.documentos) ? obj.documentos : [],
    circuitos: (obj && obj.circuitos && typeof obj.circuitos === 'object') ? obj.circuitos : {},
    programa: normalizarPrograma(obj && obj.programa)
  };
  db.documentos = db.documentos.map(normalizarDoc).filter(Boolean);
  const maxCorr = db.documentos.reduce((m,d)=>Math.max(m, Number(d.correlativo)||0), 0);
  if(db.correlativo <= maxCorr) db.correlativo = maxCorr + 1;
  return db;
}

/* Avance del programa de montaje (Módulo 05): registros por actividad, restricciones y cortes */
function normalizarPrograma(p){
  p = (p && typeof p === 'object') ? p : {};
  const av = {};
  Object.keys(p.avances || {}).forEach(function(k){
    const a = p.avances[k] || {};
    av[k] = { pct: Math.max(0, Math.min(100, Number(a.pct) || 0)), inicioReal: str(a.inicioReal), finReal: str(a.finReal),
              comentario: str(a.comentario), fecha: str(a.fecha), por: str(a.por) };
  });
  return {
    version: Number(p.version) || 0,
    pendiente: !!p.pendiente,
    fechaCorte: str(p.fechaCorte),
    avances: av,
    cortes: (p.cortes && typeof p.cortes === 'object') ? p.cortes : {},
    restricciones: Array.isArray(p.restricciones) ? p.restricciones.map(function(r){
      return { id: r.id || uid(), fecha: str(r.fecha), tipo: str(r.tipo) || 'Restricción', descripcion: str(r.descripcion),
               actividad: str(r.actividad), impacto: str(r.impacto) || 'Plazo', diasImpacto: Number(r.diasImpacto) || 0,
               responsable: str(r.responsable), accion: str(r.accion), estado: str(r.estado) || 'Abierta', fechaCierre: str(r.fechaCierre) };
    }) : []
  };
}

   ================================================================== */

function str(v){ return v == null ? '' : String(v); }
function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function $(sel, ctx){ return (ctx||document).querySelector(sel); }
function $$(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }

function esc(s){
  return str(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
               .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function attr(s){ return esc(s); }

/* --- Fechas: se guardan en ISO (aaaa-mm-dd), se muestran dd-mm-aaaa --- */
function hoyISO(){
  const d = new Date();
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function pad(n){ return (n<10?'0':'') + n; }
function fmtFecha(iso){
  if(!iso) return '—';
  const p = String(iso).split('-');
  if(p.length !== 3) return esc(iso);
  return p[2] + '-' + p[1] + '-' + p[0];
}
function fechaObj(iso){
  if(!iso) return null;
  const p = String(iso).split('-').map(Number);
  if(p.length !== 3 || !p[0]) return null;
  const d = new Date(p[0], p[1]-1, p[2]);
  return isNaN(d.getTime()) ? null : d;
}
function diasCorridos(desdeISO, hastaISO){
  const a = fechaObj(desdeISO), b = fechaObj(hastaISO);
  if(!a || !b) return null;
  return Math.round((b - a) / 86400000);
}
function diasHabiles(desdeISO, hastaISO){
  const a = fechaObj(desdeISO), b = fechaObj(hastaISO);
  if(!a || !b) return null;
  if(b < a) return -diasHabiles(hastaISO, desdeISO);
  let n = 0; const cur = new Date(a.getTime());
  while(cur < b){
    cur.setDate(cur.getDate()+1);
    const dw = cur.getDay();
    if(dw !== 0 && dw !== 6) n++;
  }
  return n;
}
function dias(desdeISO, hastaISO){
  return DB.params.usarDiasHabiles ? diasHabiles(desdeISO, hastaISO) : diasCorridos(desdeISO, hastaISO);
}
function mesEtiqueta(iso){
  const M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const p = String(iso).split('-');
  if(p.length < 2) return '—';
  return M[Number(p[1])-1] + '-' + String(p[0]).slice(2);
}

/* --- Lógica de negocio sobre documentos --- */
function revActual(doc){ return doc.revisiones[doc.revisiones.length - 1]; }
function estadoInfo(id){
  for(let i=0;i<ESTADOS_REV.length;i++) if(ESTADOS_REV[i].id === id) return ESTADOS_REV[i];
  return ESTADOS_REV[0];
}
function nComentarios(rev){ return rev.comentarios.length || Number(rev.nComentarios) || 0; }
function comentariosAbiertos(doc){
  let n = 0;
  doc.revisiones.forEach(function(r){
    r.comentarios.forEach(function(c){ if(c.estado === 'Abierto' || c.estado === 'Respondido') n++; });
  });
  return n;
}
function altasAbiertas(doc){
  let n = 0;
  doc.revisiones.forEach(function(r){
    r.comentarios.forEach(function(c){
      if(c.criticidad === 'Alta' && (c.estado === 'Abierto' || c.estado === 'Respondido')) n++;
    });
  });
  return n;
}
/* Días en revisión de la revisión vigente */
function diasEnRevision(doc){
  const r = revActual(doc);
  if(!r.fechaRecepcion) return null;
  const hasta = r.fechaRespuesta || hoyISO();
  return dias(r.fechaRecepcion, hasta);
}
/* Semáforo de plazo: {cls, label, restante} */
function semaforo(doc){
  const r = revActual(doc);
  const usados = diasEnRevision(doc);
  if(usados == null) return { cls:'neutral', label:'Sin fecha', restante:null };
  const plazo = Number(r.plazoDias) || DB.params.plazoRevisionDias;
  const restante = plazo - usados;
  if(estadoInfo(r.estado).cerrado){
    return restante >= 0
      ? { cls:'ok',  label:'Cerrado en plazo ('+usados+' d)', restante:restante }
      : { cls:'bad', label:'Cerrado fuera de plazo ('+usados+' d)', restante:restante };
  }
  if(restante < 0)  return { cls:'bad',  label:'Vencido ('+Math.abs(restante)+' d)', restante:restante };
  if(restante <= 2) return { cls:'warn', label:'Por vencer ('+restante+' d)', restante:restante };
  return { cls:'ok', label:'En plazo ('+restante+' d)', restante:restante };
}
function estaVencido(doc){
  const s = semaforo(doc);
  return !estadoInfo(revActual(doc).estado).cerrado && s.restante != null && s.restante < 0;
}
function bloqueadoParaConstruccion(doc){ return altasAbiertas(doc) > 0; }

/* --- Interfaz: toast, descarga, modal --- */
function toast(msg, tipo, ms){
  const box = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + (tipo || '');
  el.innerHTML = msg;
  box.appendChild(el);
  setTimeout(function(){ el.remove(); }, ms || 4200);
}
function descargar(nombre, contenido, mime){
  /* Versión publicada en claude.ai: el visor entrega el archivo a través de la capacidad "downloads" */
  if(typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function'){
    window.claude.use('downloads').then(function(dl){
      if(!dl){ toast('La descarga no está disponible en esta vista. Use la copia local de la app para exportar.', 'bad', 6000); return; }
      return dl.save({ filename: nombre, data: contenido }).then(function(){ toast('Archivo guardado.', 'ok'); })
        .catch(function(e){ if(e && e.code !== 'declined') toast('No se pudo guardar el archivo (' + esc(e && e.code || '') + ').', 'bad'); });
    });
    return;
  }
  try{
    const blob = new Blob([contenido], { type: mime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 500);
  }catch(e){ toast('No se pudo generar el archivo: ' + esc(e.message), 'bad'); }
}
function abrirModal(html, ancho){
  const root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="overlay" id="ovl"><div class="modal ' + (ancho==='narrow'?'narrow':'') + '">' + html + '</div></div>';
  const ovl = document.getElementById('ovl');
  ovl.addEventListener('mousedown', function(ev){ if(ev.target === ovl) cerrarModal(); });
  document.addEventListener('keydown', escCierra);
  if(typeof aplicarModoLectura === 'function') aplicarModoLectura(root);
  const primero = root.querySelector('input,select,textarea,button');
  if(primero) primero.focus();
}
function cerrarModal(){
  document.getElementById('modalRoot').innerHTML = '';
  document.removeEventListener('keydown', escCierra);
}
function escCierra(ev){ if(ev.key === 'Escape') cerrarModal(); }
function confirmar(titulo, texto, onOk, textoBoton){

function opciones(lista, sel){
  return lista.map(function(v){
    return '<option value="' + attr(v) + '"' + (v === sel ? ' selected' : '') + '>' + esc(v) + '</option>';
  }).join('');
}
function valorCampo(id){
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

/* --- Apertura de archivos: ruta relativa (misma carpeta) o URL --- */
function esURL(s){ return /^(https?:|file:)/i.test(str(s).trim()); }
function hrefArchivo(ruta){
  ruta = str(ruta).trim();
  if(!ruta) return '';
  if(esURL(ruta)) return ruta;
  /* ruta relativa: se codifica para que espacios y acentos funcionen en el navegador */
  return ruta.split('/').map(encodeURIComponent).join('/');
}
/* Enlace principal del documento: archivo de la revisión vigente, luego enlace general, luego Drive */
/* En la versión publicada en la web (no file://) las rutas relativas no existen:
   se usa primero el enlace de Google Drive, salvo que haya una carpeta conectada. */
const MODO_WEB = (typeof location !== 'undefined' && location.protocol !== 'file:');
function enlaceDoc(doc, rev){
  const r = rev || revActual(doc);
  const conectada = (typeof CARPETA !== 'undefined' && CARPETA.conectada);
  if(MODO_WEB && !conectada) return driveDe(r.archivo) || hrefArchivo(doc.enlaceDrive) || driveDe(doc.enlace) || (esURL(doc.enlace) ? hrefArchivo(doc.enlace) : '');
  return hrefArchivo(r.archivo) || hrefArchivo(doc.enlace) || hrefArchivo(doc.enlaceDrive) || driveDe(r.archivo);
}
function abrirDocumento(id, revId){
  const d = docPorId(id);
  if(!d) return;
  let r = null;
  if(revId) r = d.revisiones.filter(function(x){ return x.id === revId; })[0];
  /* 1) carpeta conectada: se lee el archivo directamente */
  if(clickDoc(null, id, revId) === false) return;
  /* 2) ruta relativa o URL */
  const h = enlaceDoc(d, r);
  if(!h){ toast('Este documento no tiene archivo ni enlace asociado. Edite la ficha y complete "Archivo PDF".', 'bad'); return; }
  window.open(h, '_blank', 'noopener');
}
function enlaceAbrir(doc, texto, cls){
  const h = enlaceDoc(doc);
  const enCarpeta = typeof entradaDe === 'function' && entradaDe(revActual(doc).archivo || doc.enlace);
  if(!h && !enCarpeta) return '<span class="' + (cls || '') + '" title="Sin archivo asociado">' + texto + '</span>';
  return '<a class="' + (cls || '') + ' doclink" href="' + attr(h || '#') + '" target="_blank" rel="noopener" ' +
         'onclick="return clickDoc(event,\'' + doc.id + '\')" title="Abrir el documento en una pestaña nueva">' + texto + '</a>';
}

/* --- Respaldo completo en JSON --- */
function exportarJSON(){
  const nombre = 'respaldo_control_contrato_' + hoyISO() + '.json';
  descargar(nombre, JSON.stringify(DB, null, 2), 'application/json;charset=utf-8');
  toast('Respaldo JSON descargado.', 'ok');
}
function importarJSON(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = function(){
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = function(){
      try{
        const obj = JSON.parse(fr.result);
        DB = normalizarDB(obj);
        guardarDB(); render();
        toast('Base restaurada: ' + DB.documentos.length + ' documento(s).', 'ok');
      }catch(e){ toast('Archivo JSON inválido: ' + esc(e.message), 'bad'); }
    };
    fr.readAsText(f, 'utf-8');
  };

}

/* --- Exportación CSV compatible con Excel en español --- */
function csvCampo(v){
  const s = str(v).replace(/"/g,'""');
  return '"' + s + '"';
}
function exportarCSV(docs){
  const cab = ['N°','Código','Revisión','Título','Disciplina','Tipo','Fase','Área / Sistema','Emisor',
               'Fecha recepción','Transmittal','Formatos','Revisor','Inicio revisión','Estado de revisión',
               'Comentarios emitidos','Comentarios abiertos','Fecha respuesta','Días en revisión',
               'Plazo (días)','Semáforo','Estado final','Verificación terreno','RFI','NCR','Observaciones'];
  const filas = docs.map(function(doc){
    const r = revActual(doc), s = semaforo(doc), dv = diasEnRevision(doc);
    return [
      doc.correlativo, doc.codigo, r.rev, doc.titulo, doc.disciplina, doc.tipo, doc.fase, doc.area, doc.emisor,
      fmtFecha(r.fechaRecepcion), r.transmittal, doc.formatos.join(' / '), r.revisor, fmtFecha(r.fechaInicioRevision),
      estadoInfo(r.estado).label, nComentarios(r), comentariosAbiertos(doc), fmtFecha(r.fechaRespuesta),
      (dv == null ? '' : dv), r.plazoDias, s.label, doc.estadoFinal, doc.terreno.estado,
      doc.terreno.rfiNumero, doc.terreno.ncr, doc.observaciones
    ].map(csvCampo).join(';');
  });
  const texto = '\uFEFF' + cab.map(csvCampo).join(';') + '\r\n' + filas.join('\r\n') + '\r\n';
  descargar('matriz_ingenieria_recibida_' + hoyISO() + '.csv', texto, 'text/csv;charset=utf-8');

function fechaDesdeTexto(t){
  t = str(t).trim();
  if(!t) return '';
  let m = t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
  if(m) return m[3] + '-' + pad(Number(m[2])) + '-' + pad(Number(m[1]));
  m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return m[1] + '-' + pad(Number(m[2])) + '-' + pad(Number(m[3]));
  return '';
}
function coincide(lista, valor, porDefecto){
  const v = str(valor).trim().toLowerCase();
  for(let i=0;i<lista.length;i++) if(lista[i].toLowerCase() === v) return lista[i];
  for(let i=0;i<lista.length;i++) if(v && lista[i].toLowerCase().indexOf(v) === 0) return lista[i];
  return porDefecto;
}

function procesarCargaMasiva(){
  const txt = document.getElementById('bulkTxt').value;
  const lineas = txt.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  if(!lineas.length){ document.getElementById('bulkMsg').innerHTML = '<div class="badbox">No se pegó ninguna fila.</div>'; return; }

  let agregados = 0, omitidos = 0;
  const detalle = [];
  lineas.forEach(function(linea, i){
    const c = linea.split('\t');
    const codigo = str(c[0]).trim();
    if(!codigo){ omitidos++; detalle.push('Fila ' + (i+1) + ': sin código.'); return; }
    const rev = str(c[1]).trim() || 'A';
    const dup = DB.documentos.some(function(d){
      return d.codigo.toLowerCase() === codigo.toLowerCase() &&
             d.revisiones.some(function(r){ return r.rev.toLowerCase() === rev.toLowerCase(); });
    });
    if(dup){ omitidos++; detalle.push('Fila ' + (i+1) + ': ' + codigo + ' Rev. ' + rev + ' ya existe.'); return; }

    const nuevo = normalizarDoc({
      correlativo: DB.correlativo++,
      codigo: codigo, titulo: str(c[2]).trim(),
      disciplina: coincide(DISCIPLINAS, c[3], 'Eléctrica'),
      tipo: coincide(TIPOS_DOC, c[4], 'Otro'),
      fase: coincide(FASES, c[5], 'Detalle'),
      area: str(c[6]).trim(), emisor: str(c[7]).trim(),
      revisiones: [{
        rev: rev, fechaRecepcion: fechaDesdeTexto(c[8]) || hoyISO(), transmittal: str(c[9]).trim(),
        motivo: 'Carga masiva', incorporacion:'No aplica', estado:'recibido',
        plazoDias: DB.params.plazoRevisionDias
      }]
    });
    DB.documentos.push(nuevo); agregados++;
  });

  guardarDB();
  document.getElementById('bulkMsg').innerHTML =
    '<div class="' + (agregados ? 'help' : 'warnbox') + '"><b>' + agregados + '</b> documento(s) agregado(s), <b>' +
    omitidos + '</b> omitido(s).' + (detalle.length ? '<br>' + detalle.slice(0,8).map(esc).join('<br>') : '') + '</div>';
  if(agregados){ toast(agregados + ' documento(s) cargado(s).', 'ok'); }
}

/* Índice ruta -> {nodo, padre} para breadcrumb y activación */
function buscarRuta(ruta){
  for(let i=0;i<MENU.length;i++){
    const m = MENU[i];
    if(m.route === ruta) return { nodo:m, padre:null };
    if(m.children){
      /* ruta del módulo padre (p. ej. #/plan o #/guia): abre su primera página */
      if(ruta === m.id || ruta === m.children[0].route.split('/')[0]) return { nodo:m.children[0], padre:m };
      for(let j=0;j<m.children.length;j++){
        if(m.children[j].route === ruta) return { nodo:m.children[j], padre:m };
      }
    }
  }
  return null;
}
function rutaActual(){
  const h = (location.hash || '').replace(/^#\/?/, '');
  return h || 'dashboard';
}
function ir(ruta){ location.hash = '#/' + ruta; }

function onHashChange(){
  const r = rutaActual();
  ESTADO_UI.ruta = buscarRuta(r) ? r : 'dashboard';
  const info = buscarRuta(ESTADO_UI.ruta);
  if(info && info.padre) ESTADO_UI.abiertos[info.padre.id] = true;
  cerrarModal();
  render();
  document.querySelector('.content').scrollTop = 0;
  window.scrollTo(0, 0);

  if(window.innerWidth <= 860) sb.classList.remove('open');
}

/* ---- Construcción del árbol lateral ---- */
function renderMenu(){
  const tree = document.getElementById('tree');
  const ruta = ESTADO_UI.ruta;
  let html = '';

  MENU.forEach(function(m){
    const tieneHijos = !!(m.children && m.children.length);
    const abierto = !!ESTADO_UI.abiertos[m.id];
    const activo = (m.route === ruta) || (tieneHijos && m.children.some(function(c){ return c.route === ruta; }));
    const ico = m.icon === 'chart' ? ICO.chart : m.icon === 'gear' ? ICO.gear : m.icon === 'book' ? ICO.book
              : (tieneHijos && abierto ? ICO.folderOpen : ICO.folderClosed);
    const badge = contadorModulo(m);

    html += '<div class="node">';
    html += '<button class="node-head' + (activo ? ' active' : '') + '" data-id="' + attr(m.id) + '"' +
            (m.route ? ' data-route="' + attr(m.route) + '"' : '') +
            ' data-tree="' + (tieneHijos ? '1' : '0') + '">' +
            (tieneHijos ? '<span class="caret' + (abierto ? ' open' : '') + '">▶</span>' : '<span class="caret" style="visibility:hidden">▶</span>') +
            '<span class="ico">' + ico + '</span>' +
            '<span class="txt">' + esc(m.code + ' — ' + m.label) + '</span>' +
            badge + '</button>';

    if(tieneHijos && abierto){
      html += '<div class="children">';
      m.children.forEach(function(c){
        html += '<button class="node-head' + (c.route === ruta ? ' active' : '') + '" data-route="' + attr(c.route) + '" data-tree="0">' +
                '<span class="ico">' + ICO.doc + '</span><span class="txt">' + esc(c.label) + '</span></button>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  tree.innerHTML = html;

  $$('.node-head', tree).forEach(function(b){
    b.addEventListener('click', function(){
      const esArbol = b.getAttribute('data-tree') === '1';
      const id = b.getAttribute('data-id');
      const route = b.getAttribute('data-route');
      if(esArbol){
        ESTADO_UI.abiertos[id] = !ESTADO_UI.abiertos[id];
        renderMenu();
        return;
      }
      if(route) ir(route);
    });
  });
}

   ==================================================================
   Filtra documentos por código, título o disciplina desde cualquier
   vista y lleva directamente a la ficha del documento.
   ================================================================== */
function buscarDocs(q){
  q = str(q).trim().toLowerCase();
  if(!q) return [];
  return DB.documentos.filter(function(d){
    return (d.codigo + ' ' + d.titulo + ' ' + d.disciplina + ' ' + d.area + ' ' + d.emisor).toLowerCase().indexOf(q) >= 0;
  }).slice(0, 12);
}
function initBuscador(){
  const inp = document.getElementById('globalSearch');
  const pop = document.getElementById('searchPop');

  function pintar(){
    const res = buscarDocs(inp.value);
    if(!inp.value.trim()){ pop.hidden = true; pop.innerHTML = ''; return; }
    pop.hidden = false;
    if(!res.length){ pop.innerHTML = '<div class="empty">Sin coincidencias.</div>'; return; }
    pop.innerHTML = res.map(function(d){
      const r = revActual(d);
      return '<button data-id="' + attr(d.id) + '"><span class="mono">' + esc(d.codigo) + '</span> · Rev. ' + esc(r.rev) +
             '<br><span style="color:var(--text-2)">' + esc(d.titulo) + '</span>' +
             '<br><span class="tag">' + esc(d.disciplina) + '</span>' + pillEstado(r.estado) + '</button>';
    }).join('');
    $$('button', pop).forEach(function(b){
      b.addEventListener('click', function(){
        pop.hidden = true; inp.value = '';
        fichaDocumento(b.getAttribute('data-id'));
      });
    });
  }
  inp.addEventListener('input', pintar);
  inp.addEventListener('focus', pintar);
  document.addEventListener('click', function(ev){
    if(!pop.contains(ev.target) && ev.target !== inp) pop.hidden = true;
  });
}

function recorta(s, n){ s = str(s); return s.length > n ? s.slice(0, n-1) + '…' : s; }

function docsFiltrados(){
  const f = ESTADO_UI.filtros;
  const q = f.texto.trim().toLowerCase();
  let lista = DB.documentos.filter(function(d){
    if(q && (d.codigo + ' ' + d.titulo + ' ' + d.disciplina + ' ' + d.area + ' ' + d.emisor + ' ' + revActual(d).transmittal).toLowerCase().indexOf(q) < 0) return false;
    if(f.disciplina && d.disciplina !== f.disciplina) return false;
    if(f.tipo && d.tipo !== f.tipo) return false;
    if(f.fase && d.fase !== f.fase) return false;
    if(f.estado && revActual(d).estado !== f.estado) return false;
    if(f.soloVencidos && !estaVencido(d)) return false;
    if(f.soloComentarios && comentariosAbiertos(d) === 0) return false;
    return true;
  });
  const col = COLS.filter(function(c){ return c.id === ESTADO_UI.orden.campo; })[0] || COLS[0];
  const asc = ESTADO_UI.orden.asc ? 1 : -1;
  lista.sort(function(a,b){
    const va = col.val(a), vb = col.val(b);
    if(va < vb) return -1*asc;
    if(va > vb) return 1*asc;
    return 0;
  });
  return lista;
}

    '<span class="spacer"></span>' +
    '<span style="font-size:12.5px;color:var(--text-2)">' + lista.length + ' de ' + DB.documentos.length + ' documento(s)</span>' +

  html += '<div class="card card-pad" style="margin-bottom:14px">' +
    '<div class="fgrid">' +

      '<div><label class="f" for="fDisc">Disciplina</label><select class="inp" id="fDisc"><option value="">Todas</option>' + opciones(DISCIPLINAS, f.disciplina) + '</select></div>' +

      '<div><label class="f" for="fFase">Fase</label><select class="inp" id="fFase"><option value="">Todas</option>' + opciones(FASES, f.fase) + '</select></div>' +
      '<div><label class="f" for="fEstado">Estado de revisión</label><select class="inp" id="fEstado"><option value="">Todos</option>' +
        ESTADOS_REV.map(function(e){ return '<option value="' + e.id + '"' + (e.id === f.estado ? ' selected' : '') + '>' + esc(e.label) + '</option>'; }).join('') +
        '</select></div>' +
    '</div>' +
    '<div style="margin-top:10px">' +
      '<label class="chk"><input type="checkbox" id="fVenc"' + (f.soloVencidos ? ' checked' : '') + '> Solo vencidos en plazo</label>' +
      '<label class="chk"><input type="checkbox" id="fCom"' + (f.soloComentarios ? ' checked' : '') + '> Solo con comentarios abiertos</label>' +
      '<button class="btn sm" onclick="limpiarFiltros()">Limpiar filtros</button>' +

  /* --- tabla --- */
  if(!lista.length){
    html += '<div class="card empty-state"><div class="big">🗂</div>' +
            (DB.documentos.length ? 'Ningún documento cumple los filtros aplicados.' :
             'Aún no hay documentos registrados. Use <b>+ Nuevo documento</b> o la carga masiva desde Excel.') + '</div>';
    return html;

  html += '<div class="tbl-wrap"><table><thead><tr>';

    html += '<th onclick="ordenarPor(\'' + c.id + '\')" title="Ordenar por ' + attr(c.th) + '">' + esc(c.th) +
            '<span class="arr">' + (act ? (ESTADO_UI.orden.asc ? '▲' : '▼') : '⇅') + '</span></th>';
  });
  html += '<th style="cursor:default">Acciones</th></tr></thead><tbody>';

  lista.forEach(function(d){

    '</td></tr>';

/* Enlaza los filtros después de pintar la vista (patrón <vista>Post) */
function renderMatrizPost(){
  const f = ESTADO_UI.filtros;
  const t = document.getElementById('fTexto');
  if(t){
    t.addEventListener('input', function(){ f.texto = t.value; repintarTabla(); });
  }
  const map = { fDisc:'disciplina', fTipo:'tipo', fFase:'fase', fEstado:'estado' };
  Object.keys(map).forEach(function(k){
    const el = document.getElementById(k);
    if(el) el.addEventListener('change', function(){ f[map[k]] = el.value; render(); });
  });
  const v = document.getElementById('fVenc');  if(v) v.addEventListener('change', function(){ f.soloVencidos = v.checked; render(); });
  const c = document.getElementById('fCom');   if(c) c.addEventListener('change', function(){ f.soloComentarios = c.checked; render(); });
}
/* Repinta sin perder el foco del campo de texto */
function repintarTabla(){
  const cont = document.getElementById('content');
  const foco = document.activeElement;
  const pos = foco && foco.id === 'fTexto' ? foco.selectionStart : null;
  cont.innerHTML = renderMatriz();
  renderMatrizPost();
  if(pos != null){
    const t = document.getElementById('fTexto');
    if(t){ t.focus(); try{ t.setSelectionRange(pos, pos); }catch(e){} }
  }
}
function ordenarPor(campo){
  if(ESTADO_UI.orden.campo === campo) ESTADO_UI.orden.asc = !ESTADO_UI.orden.asc;
  else { ESTADO_UI.orden.campo = campo; ESTADO_UI.orden.asc = true; }
  render();
}
function limpiarFiltros(){
  ESTADO_UI.filtros = { texto:'', disciplina:'', estado:'', fase:'', tipo:'', soloVencidos:false, soloComentarios:false };
  render();
}

function campo(id, label, control, ayudaTxt){

         (ayudaTxt ? ' ' + ayuda(ayudaTxt) : '') + '</label>' + control + '</div>';

function guardarDocumento(id){
  const nuevo = !id;
  const d = nuevo ? null : docPorId(id);
  const errores = [];

  const codigo = valorCampo('fCodigo');
  const rev    = valorCampo('fRev');
  const titulo = valorCampo('fTitulo');
  const fRec   = valorCampo('fFecRec');
  const fResp  = valorCampo('fFecResp');
  const fIni   = valorCampo('fIniRev');

  if(!codigo) errores.push('El código del documento es obligatorio.');
  if(!rev)    errores.push('La revisión es obligatoria.');
  if(!titulo) errores.push('El título es obligatorio.');
  if(!fRec)   errores.push('La fecha de recepción es obligatoria.');

  /* código + revisión no duplicados */
  const dup = DB.documentos.some(function(x){
    if(!nuevo && x.id === id) return false;
    return x.codigo.toLowerCase() === codigo.toLowerCase() &&
           x.revisiones.some(function(r){ return r.rev.toLowerCase() === rev.toLowerCase(); });
  });
  if(dup) errores.push('Ya existe el documento <b>' + esc(codigo) + '</b> en la revisión <b>' + esc(rev) + '</b>.');

  /* coherencia de fechas */
  if(fResp && fRec && fResp < fRec) errores.push('La fecha de respuesta no puede ser anterior a la de recepción.');
  if(fIni && fRec && fIni < fRec)   errores.push('La fecha de inicio de revisión no puede ser anterior a la de recepción.');
  if(fResp && fIni && fResp < fIni) errores.push('La fecha de respuesta no puede ser anterior al inicio de la revisión.');

  /* regla de negocio: liberación para construcción */
  const estadoFinal = valorCampo('fFinal');
  if(!nuevo && estadoFinal === 'Vigente para construcción' && altasAbiertas(d) > 0){
    errores.push('No puede declararse <b>Vigente para construcción</b>: hay ' + altasAbiertas(d) +
                 ' comentario(s) de criticidad <b>Alta</b> sin cerrar (vista 1.2).');
  }

  if(errores.length){
    document.getElementById('formErr').innerHTML =
      '<div class="badbox"><b>Revise lo siguiente:</b><ul style="margin:6px 0 0 16px;padding:0">' +
      errores.map(function(e){ return '<li>' + e + '</li>'; }).join('') + '</ul></div>';
    document.querySelector('.modal-body').scrollTop = 0;
    return;
  }

  const formatos = $$('.fFormato').filter(function(c){ return c.checked; }).map(function(c){ return c.value; });
  const datos = {
    codigo: codigo, titulo: titulo,
    disciplina: valorCampo('fDisciplina'), tipo: valorCampo('fTipo2'), fase: valorCampo('fFase2'),
    area: valorCampo('fArea'), emisor: valorCampo('fEmisor'), enlace: valorCampo('fEnlace'), enlaceDrive: valorCampo('fDrive'),
    formatos: formatos, estadoFinal: estadoFinal, observaciones: valorCampo('fObs')
  };
  const datosRev = {
    rev: rev, fechaRecepcion: fRec, transmittal: valorCampo('fTrans'),
    revisor: valorCampo('fRevisor'), fechaInicioRevision: fIni,
    estado: valorCampo('fEstadoRev'), fechaRespuesta: fResp,
    plazoDias: Number(valorCampo('fPlazo')) || DB.params.plazoRevisionDias,
    nComentarios: Number(valorCampo('fNCom')) || 0,
    archivo: valorCampo('fArchivo')
  };

  if(nuevo){
    const doc = normalizarDoc(Object.assign({ correlativo: DB.correlativo++, revisiones: [ Object.assign(revVacia(rev), datosRev) ] }, datos));
    DB.documentos.push(doc);
    toast('Documento <b>' + esc(codigo) + '</b> registrado.', 'ok');
  }else{
    Object.assign(d, datos);
    Object.assign(revActual(d), datosRev);
    toast('Documento actualizado.', 'ok');
  }
  guardarDB(); cerrarModal(); render();
}

function eliminarDoc(id){
  const d = docPorId(id);
  if(!d) return;
  confirmar('Eliminar documento',
    '<p>Se eliminará <b>' + esc(d.codigo) + '</b> con sus <b>' + d.revisiones.length +
    '</b> revisión(es) y todos sus comentarios. Esta acción no se puede deshacer.</p>',
    function(){
      DB.documentos = DB.documentos.filter(function(x){ return x.id !== id; });
      if(ESTADO_UI.docSel === id) ESTADO_UI.docSel = null;
      guardarDB(); render(); toast('Documento eliminado.', 'ok');
    });
}

          'Declare si el emisor resolvió los comentarios de la revisión anterior.') +

        campo('nArchivo', 'Archivo PDF de la nueva revisión', '<input class="inp" id="nArchivo" value="" placeholder="nombre-del-archivo Rev X.pdf">', 'Nombre del archivo en la carpeta de la app; con esto el clic en el documento abre la revisión vigente.') +
      '</div>' +
      '<div class="field"><label class="f" for="nMotivo">Motivo del cambio *</label>' +

function siguienteRev(rev){
  rev = str(rev).trim();
  if(/^\d+$/.test(rev)) return String(Number(rev) + 1);
  if(/^[A-Za-z]$/.test(rev)){
    if(rev.toUpperCase() === 'Z') return '0';
    return String.fromCharCode(rev.charCodeAt(0) + 1).toUpperCase();
  }
  return rev + '-1';
}

function guardarNuevaRevision(docId){
  const d = docPorId(docId);
  if(!d) return;
  const rev = valorCampo('nRev'), fec = valorCampo('nFecRec'), motivo = valorCampo('nMotivo');
  const errores = [];
  if(!rev) errores.push('La revisión es obligatoria.');
  if(!fec) errores.push('La fecha de recepción es obligatoria.');
  if(!motivo) errores.push('El motivo del cambio es obligatorio.');
  if(d.revisiones.some(function(r){ return r.rev.toLowerCase() === rev.toLowerCase(); }))
    errores.push('La revisión <b>' + esc(rev) + '</b> ya existe en este documento.');
  const ult = revActual(d);
  if(fec && ult.fechaRecepcion && fec < ult.fechaRecepcion)
    errores.push('La fecha de recepción no puede ser anterior a la de la revisión vigente (' + fmtFecha(ult.fechaRecepcion) + ').');

  if(errores.length){
    document.getElementById('formErr').innerHTML = '<div class="badbox"><ul style="margin:0 0 0 16px;padding:0">' +
      errores.map(function(e){ return '<li>' + e + '</li>'; }).join('') + '</ul></div>';
    return;
  }

  if(document.getElementById('nSuperar').checked) ult.estado = 'superado';

  const nueva = normalizarRev({
    rev: rev, fechaRecepcion: fec, transmittal: valorCampo('nTrans'), motivo: motivo,
    incorporacion: valorCampo('nIncorp'), revisor: valorCampo('nRevisor'),
    estado: 'recibido', plazoDias: Number(valorCampo('nPlazo')) || DB.params.plazoRevisionDias,
    archivo: valorCampo('nArchivo')
  });
  d.revisiones.push(nueva);
  guardarDB(); cerrarModal();
  ESTADO_UI.docSel = d.id;
  render();
  toast('Rev. ' + esc(rev) + ' registrada en ' + esc(d.codigo) + '.', 'ok');
}

function eliminarRevision(docId, revId){
  const d = docPorId(docId);
  if(!d || d.revisiones.length <= 1) return;
  const r = d.revisiones.filter(function(x){ return x.id === revId; })[0];
  if(!r) return;
  confirmar('Eliminar revisión',
    '<p>Se eliminará la <b>Rev. ' + esc(r.rev) + '</b> de ' + esc(d.codigo) + ' y sus ' + r.comentarios.length +
    ' comentario(s). El historial no se puede recuperar.</p>',
    function(){
      d.revisiones = d.revisiones.filter(function(x){ return x.id !== revId; });
      guardarDB(); render(); toast('Revisión eliminada.', 'ok');
    });
}

/* ---- Ciclo de comentarios ---- */
function formComentario(docId, revId, comId){
  const d = docPorId(docId);
  if(!d) return;
  const r = d.revisiones.filter(function(x){ return x.id === revId; })[0];
  if(!r) return;
  const c = comId ? r.comentarios.filter(function(x){ return x.id === comId; })[0] : null;
  const nSig = c ? c.n : (r.comentarios.reduce(function(m,x){ return Math.max(m, x.n); }, 0) + 1);

  abrirModal(
    '<div class="modal-head"><h2>' + (c ? 'Editar comentario' : 'Nuevo comentario') + ' — ' + esc(d.codigo) + ' Rev. ' + esc(r.rev) + '</h2>' +
    '<button class="x" onclick="cerrarModal()" aria-label="Cerrar">×</button></div>' +
    '<div class="modal-body"><div id="formErr"></div>' +
      '<div class="help">Un comentario de criticidad <b>Alta</b> abierto impide declarar el documento "Vigente para construcción". ' +
      'El comentario se cierra cuando el emisor responde y la oficina técnica acepta la respuesta.</div>' +
      '<div class="fgrid">' +
        campo('cN', 'N° de comentario *', '<input class="inp" id="cN" type="number" min="1" value="' + nSig + '">', '') +
        campo('cDisc', 'Disciplina', '<select class="inp" id="cDisc">' + opciones(DISCIPLINAS, (c && c.disciplina) || d.disciplina) + '</select>', '') +
        campo('cCrit', 'Criticidad *', '<select class="inp" id="cCrit">' + opciones(CRITICIDADES, c ? c.criticidad : 'Media') + '</select>',
          'Alta: impide liberar para construcción. Media: debe resolverse antes del montaje. Baja: mejora o aclaración.') +
        campo('cEst', 'Estado *', '<select class="inp" id="cEst">' + opciones(EST_COMENTARIO, c ? c.estado : 'Abierto') + '</select>', '') +
        campo('cFec', 'Fecha de cierre', '<input class="inp" id="cFec" type="date" value="' + attr(c ? c.fechaCierre : '') + '">', 'Obligatoria cuando el estado es Cerrado o Rechazado.') +
      '</div>' +
      '<div class="field"><label class="f" for="cDesc">Descripción del comentario *</label>' +
        '<textarea class="inp" id="cDesc">' + esc(c ? c.descripcion : '') + '</textarea></div>' +
      '<div class="field"><label class="f" for="cResp">Respuesta del emisor</label>' +
        '<textarea class="inp" id="cResp">' + esc(c ? c.respuesta : '') + '</textarea></div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn" onclick="cerrarModal()">Cancelar</button>' +
    '<button class="btn primary" onclick="guardarComentario(\'' + docId + '\',\'' + revId + '\',' + (comId ? "'" + comId + "'" : 'null') + ')">Guardar</button></div>');
}

function guardarComentario(docId, revId, comId){
  const d = docPorId(docId);
  const r = d.revisiones.filter(function(x){ return x.id === revId; })[0];
  const errores = [];
  const desc = valorCampo('cDesc'), est = valorCampo('cEst'), fec = valorCampo('cFec');
  const n = Number(valorCampo('cN'));

  if(!desc) errores.push('La descripción del comentario es obligatoria.');
  if(!n || n < 1) errores.push('El N° de comentario debe ser un número positivo.');
  if((est === 'Cerrado' || est === 'Rechazado') && !fec) errores.push('Indique la fecha de cierre para un comentario ' + est.toLowerCase() + '.');
  if(fec && r.fechaRecepcion && fec < r.fechaRecepcion) errores.push('La fecha de cierre no puede ser anterior a la recepción de la revisión.');
  if(r.comentarios.some(function(x){ return x.n === n && x.id !== comId; })) errores.push('Ya existe un comentario N° ' + n + ' en esta revisión.');

  if(errores.length){
    document.getElementById('formErr').innerHTML = '<div class="badbox"><ul style="margin:0 0 0 16px;padding:0">' +
      errores.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
    return;
  }

  const datos = {
    n: n, descripcion: desc, disciplina: valorCampo('cDisc'), criticidad: valorCampo('cCrit'),
    respuesta: valorCampo('cResp'), estado: est, fechaCierre: fec
  };
  if(comId){
    const c = r.comentarios.filter(function(x){ return x.id === comId; })[0];
    Object.assign(c, datos);
  }else{
    r.comentarios.push(Object.assign({ id: uid() }, datos));
  }
  r.comentarios.sort(function(a,b){ return a.n - b.n; });
  r.nComentarios = r.comentarios.length;
  /* Si aparecen comentarios y la revisión seguía "en revisión", se refleja el estado */
  if(r.estado === 'recibido' || r.estado === 'revision') r.estado = 'comentarios';

  guardarDB(); cerrarModal(); render();
  toast('Comentario guardado.', 'ok');
}

function eliminarComentario(docId, revId, comId){
  const d = docPorId(docId);
  const r = d.revisiones.filter(function(x){ return x.id === revId; })[0];
  confirmar('Eliminar comentario', '<p>Se eliminará el comentario del historial de la Rev. ' + esc(r.rev) + '.</p>', function(){
    r.comentarios = r.comentarios.filter(function(x){ return x.id !== comId; });
    r.nComentarios = r.comentarios.length;
    guardarDB(); render(); toast('Comentario eliminado.', 'ok');
  });
}

function verTerreno(id){ ESTADO_UI.docSel = id; ir('ingenieria/terreno'); }

function discrepanciasAbiertas(){
  let n = 0;
  DB.documentos.forEach(function(d){
    d.terreno.discrepancias.forEach(function(x){ if(!x.resuelta) n++; });
  });
  return n;
}
function docsConDiscrepancias(){
  return DB.documentos.filter(function(d){
    return d.terreno.discrepancias.some(function(x){ return !x.resuelta; });
  });
}
