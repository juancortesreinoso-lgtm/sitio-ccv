    kpi('Documentos verificados en terreno', verif, 'De ' + DB.documentos.length + ' recibidos', verif ? 'good' : '') +
    kpi('Documentos con discrepancia', disc.length, 'Con al menos una discrepancia sin resolver', disc.length ? 'bad' : 'good') +
    kpi('Discrepancias sin resolver', discrepanciasAbiertas(), 'Requieren RFI, modificación o aceptación', discrepanciasAbiertas() ? 'bad' : 'good') +
    kpi('RFI vigentes', DB.documentos.filter(function(d){ return d.terreno.rfiNumero && d.terreno.rfiEstado !== 'Cerrada' && d.terreno.rfiEstado !== 'No aplica'; }).length, 'Consultas técnicas abiertas', '') +
  '</div>';

  html += '<div class="tbl-wrap"><table><thead><tr>' +
    ['Código','Rev.','Título','Disciplina','Área / Sistema','Verificación en terreno','Discrep. sin resolver','Acción requerida','RFI','Estado RFI','NCR',''].map(function(t){
      return '<th style="cursor:default">' + esc(t) + '</th>';
    }).join('') + '</tr></thead><tbody>';

  DB.documentos.slice().sort(function(a,b){ return a.correlativo - b.correlativo; }).forEach(function(d){
    const t = d.terreno;
    const abiertas = t.discrepancias.filter(function(x){ return !x.resuelta; });
    const cls = t.estado === 'Verificado conforme' ? 'ok' : t.estado === 'Discrepancia detectada' ? 'bad' : 'neutral';
    const acciones = {};
    abiertas.forEach(function(x){ acciones[x.accion] = true; });
    html += '<tr>' +
      '<td><span class="mono">' + esc(d.codigo) + '</span></td>' +
      '<td><b>' + esc(revActual(d).rev) + '</b></td>' +
      '<td class="wrap">' + esc(recorta(d.titulo, 55)) + '</td>' +
      '<td>' + esc(d.disciplina) + '</td>' +
      '<td>' + esc(d.area || '—') + '</td>' +
      '<td>' + pill(cls, t.estado) + '</td>' +
      '<td class="num">' + (abiertas.length ? '<span class="pill bad">' + abiertas.length + '</span>' : '0') + '</td>' +
      '<td>' + (Object.keys(acciones).length ? Object.keys(acciones).map(function(a){ return '<span class="tag">' + esc(a) + '</span>'; }).join('') : '—') + '</td>' +
      '<td><span class="mono">' + esc(t.rfiNumero || '—') + '</span></td>' +
      '<td>' + esc(t.rfiEstado) + '</td>' +
      '<td><span class="mono">' + esc(t.ncr || '—') + '</span></td>' +
      '<td style="white-space:nowrap"><button class="btn sm" onclick="formTerreno(\'' + d.id + '\')">Gestionar</button></td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';

  /* --- detalle de discrepancias abiertas --- */
  if(disc.length){
    html += '<h2 style="margin-top:20px">Discrepancias sin resolver</h2>';
    disc.forEach(function(d){
      html += '<div class="card card-pad" style="margin-bottom:10px">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:baseline">' +
          '<span class="mono" style="font-weight:700">' + esc(d.codigo) + '</span>' +
          '<span style="color:var(--text-2)">' + esc(recorta(d.titulo, 70)) + '</span>' +
          '<button class="btn sm" style="margin-left:auto" onclick="formTerreno(\'' + d.id + '\')">Gestionar</button></div>';
      d.terreno.discrepancias.filter(function(x){ return !x.resuelta; }).forEach(function(x){
        html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px">' +
          esc(x.descripcion) +
          '<div style="margin-top:6px;color:var(--text-2)">' +
            'Detectada el <b>' + fmtFecha(x.fecha) + '</b> por ' + esc(x.responsable || '—') +
            (x.referencia ? ' · Referencia: ' + esc(x.referencia) : '') + '</div>' +
          '<div style="margin-top:6px">' +
            (x.impacto.length ? x.impacto.map(function(i){ return '<span class="tag">Impacto: ' + esc(i) + '</span>'; }).join('') : '') +
            pill('warn', x.accion) + '</div>' +
        '</div>';
      });
      html += '</div>';
    });
  }
  return html;
}

function formTerreno(docId){
  const d = docPorId(docId);
  if(!d) return;
  const t = d.terreno;

  let html = '<div class="modal-head"><h2>Trazabilidad a terreno — ' + esc(d.codigo) + '</h2>' +
    '<button class="x" onclick="cerrarModal()" aria-label="Cerrar">×</button></div><div class="modal-body">' +
    '<div class="help">Registre aquí lo verificado en obra contra este documento. Si hay discrepancia, ' +
    'defina la acción: consulta técnica (RFI), modificación de ingeniería o aceptación formal del estado actual.</div>' +
    '<div class="fgrid">' +
      campo('tEstado', 'Estado de verificación en terreno', '<select class="inp" id="tEstado">' + opciones(EST_TERRENO, t.estado) + '</select>', '') +
      campo('tRfi', 'N° de RFI / consulta técnica', '<input class="inp" id="tRfi" value="' + attr(t.rfiNumero) + '" placeholder="RFI-018">', '') +
      campo('tRfiEst', 'Estado del RFI', '<select class="inp" id="tRfiEst">' + opciones(EST_RFI, t.rfiEstado) + '</select>', '') +
      campo('tNcr', 'NCR / observación asociada', '<input class="inp" id="tNcr" value="' + attr(t.ncr) + '" placeholder="NCR-004">', 'Por ahora es solo el número; el Módulo 03 lo consumirá cuando se desarrolle.') +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:8px;margin:14px 0 8px">' +
      '<h3 style="margin:0;flex:1">Discrepancias registradas (' + t.discrepancias.length + ')</h3>' +
      '<button class="btn sm" onclick="formDiscrepancia(\'' + d.id + '\')">+ Agregar discrepancia</button></div>';

  if(!t.discrepancias.length){
    html += '<div style="font-size:12.5px;color:var(--text-3);border:1px dashed var(--border);border-radius:6px;padding:10px">Sin discrepancias registradas.</div>';
  }else{
    html += '<div class="tbl-wrap"><table><thead><tr>' +
      ['Descripción','Fecha','Responsable','Referencia','Impacto','Acción requerida','Estado',''].map(function(x){ return '<th style="cursor:default">' + esc(x) + '</th>'; }).join('') +
      '</tr></thead><tbody>';
    t.discrepancias.forEach(function(x){
      html += '<tr>' +
        '<td class="wrap">' + esc(x.descripcion) + '</td>' +
        '<td>' + fmtFecha(x.fecha) + '</td>' +
        '<td>' + esc(x.responsable || '—') + '</td>' +
        '<td class="wrap">' + esc(x.referencia || '—') + '</td>' +
        '<td>' + (x.impacto.length ? x.impacto.map(function(i){ return '<span class="tag">' + esc(i) + '</span>'; }).join('') : '—') + '</td>' +
        '<td>' + esc(x.accion) + '</td>' +
        '<td>' + pill(x.resuelta ? 'ok' : 'bad', x.resuelta ? 'Resuelta' : 'Sin resolver') + '</td>' +
        '<td style="white-space:nowrap">' +
          '<button class="btn sm" onclick="formDiscrepancia(\'' + d.id + '\',\'' + x.id + '\')">Editar</button> ' +
          '<button class="btn sm danger" onclick="eliminarDiscrepancia(\'' + d.id + '\',\'' + x.id + '\')">✕</button></td>' +
      '</tr>';
    });
    html += '</tbody></table></div>';
  }

  html += '</div><div class="modal-foot"><button class="btn" onclick="cerrarModal()">Cerrar</button>' +
    '<button class="btn primary" onclick="guardarTerreno(\'' + d.id + '\')">Guardar</button></div>';
  abrirModal(html);
}

function guardarTerreno(docId){
  const d = docPorId(docId);
  d.terreno.estado    = valorCampo('tEstado');
  d.terreno.rfiNumero = valorCampo('tRfi');
  d.terreno.rfiEstado = valorCampo('tRfiEst');
  d.terreno.ncr       = valorCampo('tNcr');
  guardarDB(); cerrarModal(); render();
  toast('Trazabilidad actualizada.', 'ok');
}

function formDiscrepancia(docId, discId){
  const d = docPorId(docId);
  const x = discId ? d.terreno.discrepancias.filter(function(y){ return y.id === discId; })[0] : null;

  abrirModal(
    '<div class="modal-head"><h2>' + (x ? 'Editar discrepancia' : 'Nueva discrepancia') + ' — ' + esc(d.codigo) + '</h2>' +
    '<button class="x" onclick="cerrarModal()" aria-label="Cerrar">×</button></div>' +
    '<div class="modal-body"><div id="formErr"></div>' +
      '<div class="field"><label class="f" for="xDesc">Descripción de la discrepancia *</label>' +
      '<textarea class="inp" id="xDesc" placeholder="Qué dice la ingeniería y qué se encontró en terreno.">' + esc(x ? x.descripcion : '') + '</textarea></div>' +
      '<div class="fgrid">' +
        campo('xFecha', 'Fecha de detección *', '<input class="inp" id="xFecha" type="date" value="' + attr(x ? x.fecha : hoyISO()) + '">', '') +
        campo('xResp', 'Responsable de la detección', '<input class="inp" id="xResp" value="' + attr(x ? x.responsable : '') + '">', '') +
        campo('xRef', 'Fotografía o referencia', '<input class="inp" id="xRef" value="' + attr(x ? x.referencia : '') + '" placeholder="Foto IMG_2291 / levantamiento L-14">', 'Identificación del respaldo: número de foto, levantamiento topográfico, informe de terreno.') +
        campo('xAccion', 'Acción requerida *', '<select class="inp" id="xAccion">' + opciones(ACCIONES_DISC, x ? x.accion : 'Por definir') + '</select>', '') +
      '</div>' +
      '<div class="field"><label class="f">Impacto</label><div>' +
        IMPACTOS.map(function(i){
          return '<label class="chk"><input type="checkbox" class="xImp" value="' + attr(i) + '"' +
                 (x && x.impacto.indexOf(i) >= 0 ? ' checked' : '') + '> ' + esc(i) + '</label>';
        }).join('') + '</div></div>' +
      '<label class="chk"><input type="checkbox" id="xResuelta"' + (x && x.resuelta ? ' checked' : '') + '> Discrepancia resuelta</label>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn" onclick="formTerreno(\'' + docId + '\')">Volver</button>' +
    '<button class="btn primary" onclick="guardarDiscrepancia(\'' + docId + '\',' + (discId ? "'" + discId + "'" : 'null') + ')">Guardar</button></div>');
}

function guardarDiscrepancia(docId, discId){
  const d = docPorId(docId);
  const desc = valorCampo('xDesc'), fecha = valorCampo('xFecha');
  const errores = [];
  if(!desc)  errores.push('La descripción es obligatoria.');
  if(!fecha) errores.push('La fecha de detección es obligatoria.');
  if(errores.length){
    document.getElementById('formErr').innerHTML = '<div class="badbox"><ul style="margin:0 0 0 16px;padding:0">' +
      errores.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
    return;
  }
  const datos = {
    descripcion: desc, fecha: fecha, responsable: valorCampo('xResp'), referencia: valorCampo('xRef'),
    impacto: $$('.xImp').filter(function(c){ return c.checked; }).map(function(c){ return c.value; }),
    accion: valorCampo('xAccion'), resuelta: document.getElementById('xResuelta').checked
  };
  if(discId){
    Object.assign(d.terreno.discrepancias.filter(function(y){ return y.id === discId; })[0], datos);
  }else{
    d.terreno.discrepancias.push(Object.assign({ id: uid() }, datos));
    if(d.terreno.estado !== 'Discrepancia detectada') d.terreno.estado = 'Discrepancia detectada';
  }
  guardarDB();
  formTerreno(docId);
  toast('Discrepancia guardada.', 'ok');
}

function eliminarDiscrepancia(docId, discId){
  const d = docPorId(docId);
  confirmar('Eliminar discrepancia', '<p>Se eliminará el registro de la discrepancia.</p>', function(){
    d.terreno.discrepancias = d.terreno.discrepancias.filter(function(y){ return y.id !== discId; });
    guardarDB(); formTerreno(docId); toast('Discrepancia eliminada.', 'ok');
  });
}
/* ==================================================================
   ===============   UNILINEAL DIDÁCTICO — ESTILO PLANO   ===========
   ==================================================================
   Dibujo SVG del unilineal simplificado con la presentación de un
   plano de ingeniería de detalle: hoja con marco y zonas, rotulado,
   símbolos IEC, pesos de línea diferenciados y tipografía técnica
   pequeña. Cada bloque es clicable (clase .blk, atributo data-k) y
   se explica en el panel de la vista 10.1.
   ================================================================== */

function svgUnilinealCCV(){
  const W = 1400, H = 900;
  const s = [];
  const P = function(x){ s.push(x); };

  /* ---------- helpers de dibujo ---------- */
  const L = function(x1,y1,x2,y2,cls){ P('<line class="' + (cls||'w') + '" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>'); };
  const PATH = function(d,cls,extra){ P('<path class="' + (cls||'w') + '" d="'+d+'"' + (extra||'') + '/>'); };
  const T = function(x,y,str,cls,anchor,extra){ P('<text class="' + (cls||'lab') + '" x="'+x+'" y="'+y+'"' + (anchor?' text-anchor="'+anchor+'"':'') + (extra||'') + '>' + str + '</text>'); };
  const R = function(x,y,w,h,cls,extra){ P('<rect class="' + (cls||'sym') + '" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"' + (extra||'') + '/>'); };
  const C = function(cx,cy,r,cls){ P('<circle class="' + (cls||'sym') + '" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>'); };
  const HIT = function(x,y,w,h){ P('<rect class="hit" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3"/>'); };
  const G0 = function(k){ P('<g class="blk" data-k="' + k + '">'); };
  const G1 = function(){ P('</g>'); };

  /* símbolo interruptor extraíble 52 (caja con aspa) centrado en (x,y) */
  const breaker = function(x,y,tag){
    R(x-8, y-11, 16, 22, 'sym');
    L(x-8, y-11, x+8, y+11, 'thin'); L(x-8, y+11, x+8, y-11, 'thin');
    T(x+12, y+3, tag || '52', 'lab');
  };
  /* transformador de corriente: círculo sobre la línea */
  const ct = function(x,y,label,side){
    C(x, y, 6, 'sym');
    if(label) T(side === 'l' ? x-10 : x+10, y+3, label, 'lab2', side === 'l' ? 'end' : 'start');
  };
  /* transformador 2 devanados (vertical) */
  const trafo2 = function(x,y){ C(x, y-10, 13, 'sym'); C(x, y+10, 13, 'sym'); };
  /* transformador 3 devanados: primario arriba, dos secundarios abajo */
  const trafo3 = function(x,y){ C(x, y-12, 13, 'sym'); C(x-14, y+10, 13, 'sym'); C(x+14, y+10, 13, 'sym'); };
  /* tiristor: triángulo + barra + puerta; dir = 1 hacia abajo, -1 hacia arriba */
  const thy = function(x,y,dir,sc){
    sc = sc || 1; const h = 9*sc, w = 8*sc;
    if(dir > 0){
      PATH('M'+(x-w)+' '+(y-h)+' L'+(x+w)+' '+(y-h)+' L'+x+' '+(y+h)+' Z', 'thin');
      L(x-w, y+h, x+w, y+h, 'thin'); L(x+w-2, y+h, x+w+4, y+h-6, 'thin');
    }else{
      PATH('M'+(x-w)+' '+(y+h)+' L'+(x+w)+' '+(y+h)+' L'+x+' '+(y-h)+' Z', 'thin');
      L(x-w, y-h, x+w, y-h, 'thin'); L(x-w+2, y-h, x-w-4, y-h+6, 'thin');
    }
  };
  /* puente cicloconvertidor: caja con dos tiristores en antiparalelo */
  const ccvBox = function(x,y,tag,sub){
    R(x-24, y-24, 48, 48, 'sym');
    thy(x-9, y, 1, 0.8); thy(x+9, y, -1, 0.8);
    T(x, y+36, tag, 'tt', 'middle'); T(x, y+46, sub, 'lab2', 'middle');
  };
  /* seccionador con cuchilla de puesta a tierra, sobre línea vertical en x, entre y0 e y1 */
  const isolator = function(x,y){
    L(x, y-16, x, y-6, 'w'); L(x, y-6, x-9, y+8, 'sym'); L(x, y+8, x, y+16, 'w');
    C(x, y-6, 1.6, 'dot');
    /* cuchilla de tierra */
    L(x, y+11, x+10, y+11, 'thin'); L(x+10, y+11, x+17, y+4, 'thin');
    earth(x+17, y+14, 0.7);
  };
  const earth = function(x,y,sc){
    sc = sc || 1;
    L(x, y-6*sc, x, y, 'thin'); L(x-7*sc, y, x+7*sc, y, 'thin'); L(x-4.5*sc, y+3*sc, x+4.5*sc, y+3*sc, 'thin'); L(x-2*sc, y+6*sc, x+2*sc, y+6*sc, 'thin');
  };
  /* condensador (dos placas) centrado en (x,y), vertical */
  const cap = function(x,y){ L(x, y-8, x, y-3, 'thin'); L(x-7, y-3, x+7, y-3, 'sym'); L(x-7, y+3, x+7, y+3, 'sym'); L(x, y+3, x, y+8, 'thin'); };
  const reactor = function(x,y){ PATH('M'+x+' '+(y-8)+' a4 4 0 0 1 0 8 a4 4 0 0 1 0 8', 'thin'); };
  const arrow = function(x1,y1,x2,y2){ P('<line class="sig" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" marker-end="url(#arrS)"/>'); };

  /* ---------- cabecera SVG ---------- */
  P('<svg id="svgCCV" class="plano" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Diagrama unilineal simplificado del accionamiento GMD del molino SAG">');
  P('<defs><marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#333"/></marker></defs>');
  P('<style>' +
    '#svgCCV{background:#fff}' +
    '#svgCCV text{font-family:"Arial Narrow","Liberation Sans Narrow",Arial,Helvetica,sans-serif;fill:#111}' +
    '#svgCCV .lab{font-size:9px}#svgCCV .lab2{font-size:8px;fill:#333}#svgCCV .tt{font-size:9.5px;font-weight:700}' +
    '#svgCCV .big{font-size:12px;font-weight:700}#svgCCV .zl{font-size:8.5px;font-weight:700;fill:#555;letter-spacing:.7px}' +
    '#svgCCV .grid{font-size:8px;fill:#666}#svgCCV .tb{font-size:8px;fill:#222}#svgCCV .tbb{font-size:9.5px;font-weight:700;fill:#111}' +
    '#svgCCV .w{stroke:#111;stroke-width:1.3;fill:none}#svgCCV .mt{stroke-width:2}#svgCCV .bus{stroke:#111;stroke-width:4.5;fill:none}' +
    '#svgCCV .lf{stroke:#111;stroke-width:1.6;fill:none}#svgCCV .dc{stroke:#111;stroke-width:1.3;fill:none;stroke-dasharray:9 3}' +
    '#svgCCV .sig{stroke:#444;stroke-width:0.9;fill:none;stroke-dasharray:3 2.5}' +
    '#svgCCV .sym{stroke:#111;stroke-width:1.3;fill:#fff}#svgCCV .thin{stroke:#111;stroke-width:0.9;fill:none}#svgCCV .dot{fill:#111;stroke:none}' +
    '#svgCCV .frame{fill:none;stroke:#111;stroke-width:1.6}#svgCCV .frame2{fill:none;stroke:#111;stroke-width:0.8}' +
    '#svgCCV .zone{fill:none;stroke:#7a7a7a;stroke-width:0.9;stroke-dasharray:7 3}' +
    '#svgCCV .blk{cursor:pointer}#svgCCV .hit{fill:transparent;stroke:none}' +
    '#svgCCV .blk:hover .hit{fill:rgba(26,107,168,.09)}' +
    '#svgCCV .blk.sel .hit{fill:rgba(26,107,168,.13);stroke:#1a6ba8;stroke-width:1;stroke-dasharray:3 2}' +
    '#svgCCV.flow .mt,#svgCCV.flow .w.p{stroke:#12507e;stroke-dasharray:7 5;animation:ccvflow 1.1s linear infinite}' +
    '#svgCCV.flow .lf{stroke:#2e7d46;stroke-dasharray:7 5;animation:ccvflow 2.2s linear infinite}' +
    '#svgCCV.flow .dc{stroke:#9a6205;animation:ccvflow 1.6s linear infinite}' +
    '@keyframes ccvflow{to{stroke-dashoffset:-24}}' +
    '</style>');

  /* ---------- hoja: marco y zonas de referencia ---------- */
  R(20, 20, W-40, H-40, 'frame'); R(36, 36, W-72, H-72, 'frame2');
  const cols = 8, rows = 6;
  for(let i=0;i<=cols;i++){
    const x = 36 + (W-72)*i/cols;
    L(x, 20, x, 36, 'thin'); L(x, H-36, x, H-20, 'thin');
    if(i<cols){ const xm = 36 + (W-72)*(i+0.5)/cols; T(xm, 31, String(i+1), 'grid', 'middle'); T(xm, H-25, String(i+1), 'grid', 'middle'); }
  }
  for(let j=0;j<=rows;j++){
    const y = 36 + (H-72)*j/rows;
    L(20, y, 36, y, 'thin'); L(W-36, y, W-20, y, 'thin');
    if(j<rows){ const ym = 36 + (H-72)*(j+0.5)/rows; T(28, ym+3, 'ABCDEF'[j], 'grid', 'middle'); T(W-28, ym+3, 'ABCDEF'[j], 'grid', 'middle'); }
  }

  /* zonas del proceso */
  R(60, 60, 1280, 172, 'zone'); T(68, 73, 'SALA ELÉCTRICA EXISTENTE MOLINO SAG · SWITCHGEAR 13,2 kV · "BY OTHERS" (CODELCO) · CABLES NUEVOS TENDIDOS POR EL CONTRATISTA', 'zl');
  G0('ehouse'); HIT(60, 244, 1280, 374); R(60, 244, 1280, 374, 'zone');
  T(68, 257, 'E-HOUSE NUEVA · SALA ELÉCTRICA MODULAR 2° PISO SOBRE EXOESQUELETO · EQUIPOS SUMINISTRO INNOMOTICS · MONTAJE, CANALIZACIÓN Y CABLEADO CONTRATISTA', 'zl'); G1();
  R(60, 630, 1280, 160, 'zone'); T(68, 643, 'ÁREA MOLINO SAG · MOTOR ANILLO EXISTENTE +1.U1 · SECCIONADORES =K01 · TRANSDUCTORES LEM EN PUNTO ESTRELLA', 'zl');

  /* ---------- barra 13,2 kV ---------- */
  G0('bus'); HIT(100, 84, 1220, 44);
  L(120, 104, 1300, 104, 'bus');
  T(122, 96, 'BARRA 13,2 kV · 3~ · 50 Hz', 'big');
  T(1298, 96, 'RELÉS DE ALIMENTADOR =C01 · =C02 · =C03 (50T / 51T / 87T) · SINCRONIZACIÓN &lt;1&gt; 25 · SUBTENSIÓN 27 · BLOQUEO 86 · PRE-DISPARO 94', 'lab2', 'end');
  G1();

  /* alimentadores: interruptor 52 + TC */

function docPorCodigo(codigo){
  codigo = str(codigo).toLowerCase();
  for(let i=0;i<DB.documentos.length;i++) if(DB.documentos[i].codigo.toLowerCase() === codigo) return DB.documentos[i];

/* Enlace a un documento de la matriz por su código: abre el PDF si existe */
function refDoc(codigo, texto){
  const d = docPorCodigo(codigo);

  if(!d) return '<span class="mono" title="No está en la matriz">' + label + '</span>';

}

/* ---- Onda de salida de un cicloconvertidor (SVG calculado) ---- */
function svgOndaCCV(){
  const W = 640, H = 200, mid = 100, amp = 70;
  const fin = 50, fout = 5, T = 0.2; /* 0,2 s = 10 ciclos de red, 1 ciclo de salida */
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Forma de onda de salida de un cicloconvertidor">';
  s += '<line x1="0" y1="' + mid + '" x2="' + W + '" y2="' + mid + '" stroke="var(--border-2)"/>';
  /* 6 tensiones de línea disponibles (3 fases × 2 polaridades), en gris */
  for(let k=0;k<6;k++){
    let d = '';
    for(let i=0;i<=W;i++){
      const t = i / W * T;
      const v = Math.sin(2*Math.PI*fin*t - k*Math.PI/3);
      d += (i ? 'L' : 'M') + i + ' ' + (mid - amp*v).toFixed(1);
    }
    s += '<path d="' + d + '" fill="none" stroke="var(--border)" stroke-width="1"/>';
  }
  /* referencia de baja frecuencia */
  let dref = '';
  for(let i=0;i<=W;i++){ const t = i/W*T; dref += (i?'L':'M') + i + ' ' + (mid - amp*0.9*Math.sin(2*Math.PI*fout*t)).toFixed(1); }
  s += '<path d="' + dref + '" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="5 4"/>';
  /* salida (idealizada): cada 1/6 de ciclo de red se dispara el tiristor cuya tensión
     más se acerca a la referencia y se mantiene conduciendo ese tramo */
  let dout = '';
  const seg = W / (fin * T * 6);   /* píxeles por tramo de conducción */
  for(let i=0;i<=W;i++){
    const t = i/W*T, ref = 0.9*Math.sin(2*Math.PI*fout*t);
    const tm = (Math.floor(i/seg) + 0.5) * seg / W * T;   /* instante medio del tramo */
    const refm = 0.9*Math.sin(2*Math.PI*fout*tm);
    let best = 0, bd = 9;
    for(let k=0;k<6;k++){
      const vm = Math.sin(2*Math.PI*fin*tm - k*Math.PI/3);
      const dist = Math.abs(vm - refm);
      if(dist < bd){ bd = dist; best = k; }
    }
    const v = Math.sin(2*Math.PI*fin*t - best*Math.PI/3);
    dout += (i?'L':'M') + i + ' ' + (mid - amp*v).toFixed(1);
  }
  s += '<path d="' + dout + '" fill="none" stroke="var(--accent-2)" stroke-width="2.2"/>';
  s += '<text x="6" y="16" font-size="11" fill="var(--text-2)">Tensión</text>';
  s += '<text x="' + (W-6) + '" y="' + (H-6) + '" font-size="11" fill="var(--text-2)" text-anchor="end">tiempo → (0,2 s = 10 ciclos de red)</text>';
  s += '</svg>' +
    '<div class="legend"><span><i style="background:var(--border)"></i>Ondas de 50 Hz disponibles (3 fases × 2 polaridades)</span>' +
    '<span><i style="background:var(--warn)"></i>Referencia de baja frecuencia (5 Hz en el ejemplo)</span>' +
    '<span><i style="background:var(--accent-2)"></i>Salida real: trozos de 50 Hz que siguen a la referencia</span></div>';
  return s;
}

   "Construccion" directamente desde el navegador:

     · el usuario la elige UNA vez con "📁 Conectar carpeta";
     · la app recuerda la carpeta (IndexedDB) y la reconecta al abrir
       (según el navegador, puede pedir un clic de confirmación);
     · cada vez que se abre la app —y cada minuto mientras está
       abierta— se revisa la carpeta: los PDF nuevos se dan de alta
       solos como documentos o revisiones nuevas, y los archivos que
       ya no están se marcan como faltantes;
     · los PDF se abren leyéndolos desde la carpeta, así que da lo
       mismo dónde esté guardado este HTML.

   En navegadores sin esta API (Firefox, Safari) la app sigue
   funcionando con los enlaces relativos: el HTML debe estar en la
   misma carpeta que los PDF.
   ================================================================== */

const CARPETA = { handle:null, nombre:'', archivos:{}, conectada:false, ultimaSync:null, ultimoInforme:null, timer:null };
const FS_INTERVALO_MS = 60000;

function fsaDisponible(){ return typeof window.showDirectoryPicker === 'function'; }

/* --- IndexedDB mínimo para guardar el "handle" de la carpeta --- */
function idbAbrir(){
  return new Promise(function(res, rej){
    try{
      const r = indexedDB.open('mies_ot_carpeta', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('kv'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    }catch(e){ rej(e); }
  });
}
function idbSet(k, v){
  return idbAbrir().then(function(db){
    return new Promise(function(res, rej){
      const t = db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k);
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ rej(t.error); };
    });
  });
}
function idbGet(k){
  return idbAbrir().then(function(db){
    return new Promise(function(res, rej){
      const t = db.transaction('kv', 'readonly');
      const q = t.objectStore('kv').get(k);
      q.onsuccess = function(){ res(q.result); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function idbDel(k){
  return idbAbrir().then(function(db){
    return new Promise(function(res){
      const t = db.transaction('kv', 'readwrite');
      t.objectStore('kv').delete(k);
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ res(); };
    });
  });
}

/* --- Conectar / reconectar --- */
function conectarCarpeta(){
  if(!fsaDisponible()){
    toast('Este navegador no permite leer carpetas. Use Chrome o Edge, o mantenga la app en la misma carpeta que los PDF.', 'bad', 8000);
    return;
  }
  window.showDirectoryPicker({ id: 'construccion', mode: 'read' }).then(function(h){
    return idbSet('carpeta', h).catch(function(){}).then(function(){ return usarCarpeta(h, true); });
  }).catch(function(e){
    if(e && e.name === 'AbortError') return;
    toast('No se pudo conectar la carpeta: ' + esc(e && e.message || e), 'bad');
  });
}
function reconectarCarpeta(){
  return idbGet('carpeta').then(function(h){
    if(!h) return false;
    return h.queryPermission({ mode: 'read' }).then(function(p){
      if(p === 'granted') return p;
      return h.requestPermission({ mode: 'read' });
    }).then(function(p){
      if(p !== 'granted') return false;
      return usarCarpeta(h, true).then(function(){ return true; });
    });
  }).catch(function(){ return false; });
}
/* Al arrancar: si la carpeta ya fue conectada antes, intenta usarla sin preguntar */
function autoConectarCarpeta(){
  if(!fsaDisponible()){ pintarEstadoCarpeta(); return; }
  idbGet('carpeta').then(function(h){
    if(!h){ pintarEstadoCarpeta(); return; }
    CARPETA.nombre = h.name; CARPETA.recordada = true;
    return h.queryPermission({ mode: 'read' }).then(function(p){
      if(p === 'granted') return usarCarpeta(h, false);
      pintarEstadoCarpeta();   /* hace falta un clic para reautorizar */
    });
  }).catch(function(){ pintarEstadoCarpeta(); });
}
function desconectarCarpeta(){
  CARPETA.handle = null; CARPETA.conectada = false; CARPETA.archivos = {}; CARPETA.recordada = false;
  if(CARPETA.timer){ clearInterval(CARPETA.timer); CARPETA.timer = null; }
  idbDel('carpeta').then(function(){ pintarEstadoCarpeta(); render(); toast('Carpeta desconectada.', 'ok'); });
}
function usarCarpeta(h, avisar){
  CARPETA.handle = h; CARPETA.nombre = h.name;
  return escanearCarpeta(avisar).then(function(){
    if(!CARPETA.timer) CARPETA.timer = setInterval(function(){ escanearCarpeta(true); }, FS_INTERVALO_MS);
  });
}

/* --- Lectura de la carpeta y sincronización con la base --- */
function listarPDFs(h){
  const archivos = {};
  const it = h.entries();
  function paso(){
    return it.next().then(function(r){
      if(r.done) return archivos;
      const nombre = r.value[0], entry = r.value[1];
      if(entry.kind === 'file' && /\.pdf$/i.test(nombre)) archivos[nombre] = entry;
      return paso();
    });
  }
  return paso();
}
function escanearCarpeta(avisar){
  if(!CARPETA.handle) return Promise.resolve();
  return listarPDFs(CARPETA.handle).then(function(archivos){
    CARPETA.archivos = archivos; CARPETA.conectada = true; CARPETA.ultimaSync = new Date();
    const inf = sincronizarDocumentos(Object.keys(archivos));
    CARPETA.ultimoInforme = inf;
    /* Solo se vuelve a dibujar la pantalla si hubo cambios y estamos en una vista de
       ingeniería o en el panel; nunca en la guía / simuladores (reiniciaría el 3D). */
    const hayCambios = !!(inf.nuevos.length || inf.revisiones.length || inf.vinculados.length);
    if(hayCambios){ guardarDB(); if(/^(ingenieria|dashboard)/.test(ESTADO_UI.ruta)) render(); }
    else if(!CARPETA.pintadaUnaVez && /^(ingenieria|dashboard)/.test(ESTADO_UI.ruta)) render();
    CARPETA.pintadaUnaVez = true;
    pintarEstadoCarpeta();
    if(avisar){
      const partes = [];
      if(inf.nuevos.length) partes.push(inf.nuevos.length + ' documento(s) nuevo(s)');
      if(inf.revisiones.length) partes.push(inf.revisiones.length + ' revisión(es) nueva(s)');
      if(inf.vinculados.length) partes.push(inf.vinculados.length + ' archivo(s) vinculado(s)');
      if(inf.faltantes.length) partes.push(inf.faltantes.length + ' archivo(s) faltante(s)');
      toast('Carpeta <b>' + esc(CARPETA.nombre) + '</b> sincronizada: ' + Object.keys(archivos).length + ' PDF. ' +
            (partes.length ? partes.join(', ') + '.' : 'Sin cambios.'), inf.faltantes.length ? 'bad' : 'ok', 6000);
    }
  }).catch(function(e){
    CARPETA.conectada = false; pintarEstadoCarpeta();
    if(avisar) toast('No se pudo leer la carpeta: ' + esc(e && e.message || e), 'bad');
  });
}

/* Interpreta el nombre de un PDF: código y revisión */
function interpretarNombre(nombre){
  let base = nombre.replace(/\.pdf$/i, '').trim();
  let rev = '';
  /* "CÓDIGO Rev B", "CÓDIGO_Rev.0", "CÓDIGO - revisión 1" */
  let m = base.match(/^(.*?)[\s_\-]+rev(?:isi[oó]n)?\.?\s*([A-Za-z0-9]{1,3})$/i);
  /* "CÓDIGO_B", "CÓDIGO_1", "CÓDIGO_R2" (formato R&Q / CODELCO) */
  if(!m) m = base.match(/^(.+?-\d{3,6})_([A-Z]|\d{1,2}|R\d{1,2})$/i);
  if(m){ base = m[1].trim(); rev = m[2].toUpperCase(); }
  return { codigo: base, rev: rev || '0', revAsumida: !m };
}
function disciplinaPorCodigo(c){
  const m = c.match(/-\d*([A-Z]{2})-\d/);
  const d = m ? m[1] : '';
  return { EL:'Eléctrica', ME:'Mecánica', AT:'Instrumentación y Control', ES:'Estructuras', CI:'Civil', AR:'Arquitectura', PI:'Piping', HV:'HVAC' }[d] || 'Multidisciplina';
}
function tipoPorCodigo(c){
  const m = c.match(/-([A-Z0-9]{3})[A-Z]{2}-/);
  const s = m ? m[1] : '';
  if(s === 'MDC') return 'Memoria de cálculo';
  if(s === 'ESP') return 'Especificación técnica';
  if(s === 'HDD') return 'Datasheet';
  if(s === 'MNL' || s === 'PRO') return 'Procedimiento';
  if(s === 'LST') return 'Lista de materiales';
  if(s === 'CER' || s === 'INF') return 'Otro';
  if(s === '202') return 'Diagrama unilineal';
  if(s === '105' || s === '401') return 'Layout';
  return 'Plano';
}
function ordenRev(r){
  r = str(r).toUpperCase();
  if(/^\d+$/.test(r)) return 1000 + Number(r);          /* números: para construcción, después de las letras */
  if(/^R\d+$/.test(r)) return 500 + Number(r.slice(1));  /* R9 (Innomotics) */
  let v = 0; for(let i=0;i<r.length;i++) v = v*27 + (r.charCodeAt(i) - 64);
  return v;
}
function archivoConocido(nombre){
  const n = nombre.toLowerCase();
  for(let i=0;i<DB.documentos.length;i++){
    const d = DB.documentos[i];
    if(d.enlace && d.enlace.toLowerCase() === n) return d;
    for(let j=0;j<d.revisiones.length;j++) if(d.revisiones[j].archivo && d.revisiones[j].archivo.toLowerCase() === n) return d;
  }
  return null;
}
/* Da de alta lo nuevo y marca lo faltante. Devuelve un informe. */
function sincronizarDocumentos(nombres){
  const inf = { nuevos:[], revisiones:[], vinculados:[], copias:[], faltantes:[] };
  const hoy = hoyISO();
  const set = {}; nombres.forEach(function(n){ set[n.toLowerCase()] = n; });

  nombres.sort().forEach(function(nombre){
    if(archivoConocido(nombre)) return;
    const p = interpretarNombre(nombre);
    const doc = docPorCodigo(p.codigo);
    if(doc){
      const mismaRev = doc.revisiones.filter(function(r){ return r.rev.toUpperCase() === p.rev; })[0];
      if(mismaRev){
        if(!mismaRev.archivo){ mismaRev.archivo = nombre; inf.vinculados.push(nombre); }
        else inf.copias.push(nombre);
        return;
      }
      const nueva = normalizarRev({
        rev: p.rev, fechaRecepcion: hoy, transmittal: 'Detectado en carpeta', archivo: nombre,
        motivo: 'Revisión detectada automáticamente en la carpeta ' + CARPETA.nombre + (p.revAsumida ? ' (revisión no indicada en el nombre; se asume 0)' : ''),
        incorporacion: 'No aplica', estado: 'recibido', plazoDias: DB.params.plazoRevisionDias
      });
      doc.revisiones.push(nueva);
      doc.revisiones.sort(function(a,b){ return ordenRev(a.rev) - ordenRev(b.rev); });
      doc.revisiones.forEach(function(r, i){
        if(i < doc.revisiones.length - 1 && !estadoInfo(r.estado).cerrado) r.estado = 'superado';
      });
      inf.revisiones.push(doc.codigo + ' Rev. ' + p.rev);
      return;
    }
    /* ¿Está en la documentación base del contrato (con título, emisor y revisiones reales)? */
    const base = documentacionBase().filter(function(b){
      return b.codigo.toLowerCase() === p.codigo.toLowerCase() ||
             b.revisiones.some(function(r){ return r.archivo && r.archivo.toLowerCase() === nombre.toLowerCase(); });
    })[0];
    if(base){
      base.correlativo = DB.correlativo++;
      base.observaciones = (base.observaciones ? base.observaciones + ' · ' : '') + 'Detectado en la carpeta ' + CARPETA.nombre + ' el ' + fmtFecha(hoy) + '.';
      DB.documentos.push(base); inf.nuevos.push(base.codigo);
      return;
    }
    const fam = emisorPorCodigo(p.codigo);
    const disciplina = disciplinaPorCodigo(p.codigo), tipo = tipoPorCodigo(p.codigo);
    const nuevo = normalizarDoc({
      correlativo: DB.correlativo++, codigo: p.codigo,
      titulo: tipo + ' ' + disciplina.toLowerCase() + ' ' + p.codigo + ' (título por completar)',
      disciplina: disciplina, tipo: tipo, fase: fam ? fam.fase : 'Detalle',
      area: fam ? fam.area : '', emisor: fam ? fam.emisor : '', enlace: '',
      observaciones: 'Dado de alta automáticamente al detectar el archivo en la carpeta ' + CARPETA.nombre + ' el ' + fmtFecha(hoy) + '. Complete el título y el transmittal desde la ficha.',
      revisiones: [{
        rev: p.rev, fechaRecepcion: hoy, transmittal: 'Detectado en carpeta', archivo: nombre,
        motivo: 'Documento detectado automáticamente en la carpeta' + (p.revAsumida ? ' (revisión no indicada en el nombre; se asume 0)' : ''),
        estado: 'recibido', plazoDias: DB.params.plazoRevisionDias
      }]
    });
    DB.documentos.push(nuevo);
    inf.nuevos.push(nuevo.codigo);
  });

  /* faltantes: revisión vigente con archivo que ya no está en la carpeta */
  DB.documentos.forEach(function(d){
    const r = revActual(d);
    const a = r.archivo || (!esURL(d.enlace) ? d.enlace : '');
    if(a && !set[a.toLowerCase()]) inf.faltantes.push(d.codigo + ' → ' + a);
  });
  return inf;
}
/* ¿El archivo de la revisión vigente existe en la carpeta conectada? */
function estadoArchivo(doc, rev){
  const r = rev || revActual(doc);
  const a = r.archivo || (!esURL(doc.enlace) ? doc.enlace : '');
  if(!a) return doc.enlaceDrive ? 'drive' : 'sin';
  if(!CARPETA.conectada) return 'relativo';
  return CARPETA.archivos[a] ? 'ok' : 'falta';
}
function badgeArchivo(doc){
  const e = estadoArchivo(doc);
  if(e === 'falta') return ' <span class="pill bad" title="El archivo no está en la carpeta conectada">archivo faltante</span>';
  if(e === 'sin')   return ' <span class="pill neutral" title="Sin archivo asociado">sin archivo</span>';
  return '';
}

/* --- Apertura de PDF leyendo la carpeta conectada --- */
function entradaDe(nombre){ return CARPETA.conectada && nombre && !esURL(nombre) ? CARPETA.archivos[nombre] : null; }
function abrirDesdeCarpeta(nombre){
  const entry = entradaDe(nombre);
  if(!entry) return false;
  const w = window.open('about:blank', '_blank');  /* se abre ahora (gesto del usuario) y se llena después */
  if(!w){ toast('El navegador bloqueó la ventana emergente. Permita ventanas emergentes para este archivo.', 'bad'); return true; }
  entry.getFile().then(function(f){
    const url = URL.createObjectURL(f);
    /* La pestaña nueva hereda el origen de esta página, así que puede mostrar el blob en un iframe
       con el visor de PDF del navegador, y además queda con el nombre del documento como título. */
    const doc = w.document;
    doc.open();
    doc.write('<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>' + esc(nombre) + '</title>' +
      '<style>html,body{margin:0;height:100%;background:#2b2f36;font-family:sans-serif}' +
      '.bar{position:fixed;top:0;left:0;right:0;height:34px;background:#1b2027;color:#dfe5ec;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:12px;z-index:2}' +
      '.bar a{color:#8cc6f5}iframe{position:absolute;top:34px;left:0;width:100%;height:calc(100% - 34px);border:0;background:#fff}</style></head>' +
      '<body><div class="bar"><b>' + esc(nombre) + '</b><span style="opacity:.7">· leído desde la carpeta ' + esc(CARPETA.nombre) + '</span>' +
      '<a href="' + url + '" download="' + attr(nombre) + '" style="margin-left:auto">Descargar</a></div>' +
      '<iframe src="' + url + '" title="' + attr(nombre) + '"></iframe></body></html>');
    doc.close();
  }).catch(function(e){
    try{ w.close(); }catch(x){}
    toast('No se pudo leer el archivo ' + esc(nombre) + ': ' + esc(e && e.message || e), 'bad');
  });
  return true;
}
/* Manejador de clic de los enlaces a documentos (matriz, ficha, guía, línea de tiempo) */
function clickDoc(ev, id, revId){
  const d = docPorId(id);
  if(!d) return true;
  const r = revId ? d.revisiones.filter(function(x){ return x.id === revId; })[0] : revActual(d);
  const nombre = (r && r.archivo) || d.enlace;
  if(abrirDesdeCarpeta(nombre)){ if(ev) ev.preventDefault(); return false; }
  if(CARPETA.conectada && nombre && !esURL(nombre)){
    if(ev) ev.preventDefault();
    toast('El archivo <b>' + esc(nombre) + '</b> no está en la carpeta conectada (' + esc(CARPETA.nombre) + ').', 'bad', 6000);
    return false;
  }
  return true;  /* sin carpeta conectada: el navegador sigue el enlace relativo o la URL */
}

/* --- Indicador en la cabecera y barra de aviso --- */
function pintarEstadoCarpeta(){
  const b = document.getElementById('carpetaBtn');
  const bar = document.getElementById('fsBar');
  if(!b || !bar) return;
  if(!fsaDisponible()){
    b.textContent = '📁 Carpeta: solo Chrome/Edge';
    b.className = 'btn sm'; b.title = 'Este navegador no permite leer carpetas; mantenga la app junto a los PDF.';
    bar.hidden = true;
    return;
  }
  if(CARPETA.conectada){
    b.textContent = '📁 ' + CARPETA.nombre + ' ✓';
    b.className = 'btn sm'; b.title = 'Carpeta conectada. Clic para volver a sincronizar ahora.';
    bar.hidden = true;
  }else if(CARPETA.recordada){
    b.textContent = '📁 Reconectar carpeta';
    b.className = 'btn sm primary'; b.title = 'Vuelva a autorizar el acceso a la carpeta ' + CARPETA.nombre;
    bar.hidden = false;
    bar.innerHTML = '<b>Carpeta ' + esc(CARPETA.nombre) + ' recordada.</b> Haga clic en <b>📁 Reconectar carpeta</b> para volver a leerla: ' +
      'así los PDF se abren con un clic y los archivos nuevos se dan de alta solos. ' +
      '<button class="btn sm primary" onclick="reconectarCarpeta()">Reconectar ahora</button>';
  }else if(MODO_WEB){
    /* versión publicada en la web: los planos se abren desde Google Drive; conectar carpeta es opcional */
    b.textContent = '📁 Carpeta local (opcional)';
    b.className = 'btn sm'; b.title = 'Si tiene la carpeta Construccion en este PC, conéctela para abrir los PDF localmente';
    bar.hidden = true;
  }else{
    b.textContent = '📁 Conectar carpeta';
    b.className = 'btn sm primary'; b.title = 'Elija la carpeta Construccion (una sola vez)';
    bar.hidden = false;
    bar.innerHTML = '<b>Conecte la carpeta de los planos</b> (una sola vez): la app leerá los PDF de <b>Construccion</b>, ' +
      'dará de alta automáticamente los documentos nuevos y abrirá cada plano con un clic, sin importar desde dónde se abra este archivo. ' +
      '<button class="btn sm primary" onclick="conectarCarpeta()">📁 Conectar carpeta</button>';
  }
}
function initCarpeta(){
  const b = document.getElementById('carpetaBtn');
  if(b) b.addEventListener('click', function(){
    if(CARPETA.conectada) escanearCarpeta(true);
    else if(CARPETA.recordada) reconectarCarpeta().then(function(ok){ if(!ok) conectarCarpeta(); });
    else conectarCarpeta();
  });
  autoConectarCarpeta();
}

/* ==================================================================
   Completar documentos dados de alta automáticamente con los datos
   de la documentación base (título, emisor, área, revisiones) y
   agregar los documentos base que aún no existan. Se ejecuta al
   iniciar; BASE_VERSION evita repetir la carga de base en cada
   apertura (así, un documento borrado a propósito no reaparece).
   ================================================================== */
const BASE_VERSION = 4;
function esStub(d){ return /^Completar título|\(título por completar\)$/i.test(str(d.titulo)); }
function migrarBase(){
  const base = documentacionBase();
  let cambios = 0;
  function archivosDe(d){ return d.revisiones.map(function(r){ return str(r.archivo).toLowerCase(); }).filter(Boolean); }
  function baseDe(d){
    const cod = d.codigo.toLowerCase(), arcs = archivosDe(d);
    return base.filter(function(b){
      return b.codigo.toLowerCase() === cod || archivosDe(b).some(function(a){ return arcs.indexOf(a) >= 0; });
    })[0] || null;
  }
  /* 1) Stubs → datos reales */
  DB.documentos.forEach(function(d, i){
    if(!esStub(d)) return;
    const b = baseDe(d);
    if(b){
      b.id = d.id; b.correlativo = d.correlativo; b.terreno = d.terreno;
      /* conserva comentarios hechos sobre la revisión vigente del stub */
      const vs = revActual(d), vb = revActual(b);
      if(vs && vb && vs.comentarios && vs.comentarios.length){ vb.comentarios = vs.comentarios; vb.nComentarios = vs.comentarios.length; }
      DB.documentos[i] = b; cambios++;
      return;
    }
    const fam = emisorPorCodigo(d.codigo);
    if(fam){
      if(!d.emisor){ d.emisor = fam.emisor; cambios++; }
      if(!d.area){ d.area = fam.area; cambios++; }
    }
    /* código con sufijo de revisión mal interpretado (…_B) */
    const m = d.codigo.match(/^(.+?-\d{3,6})_([A-Z]|\d{1,2})$/i);
    if(m){ d.codigo = m[1]; const r = revActual(d); if(r && r.rev === '0'){ r.rev = m[2].toUpperCase(); } cambios++; }
  });
  /* 2) Documentos base que faltan (una vez por versión de base) */
  if((Number(DB.params.baseVersion) || 0) < BASE_VERSION){
    base.forEach(function(b){
      const existe = DB.documentos.some(function(d){
        return d.codigo.toLowerCase() === b.codigo.toLowerCase() ||
               archivosDe(d).some(function(a){ return archivosDe(b).indexOf(a) >= 0; });
      });
      if(existe) return;
      b.correlativo = DB.correlativo++; DB.documentos.push(b); cambios++;
    });
    DB.params.baseVersion = BASE_VERSION; cambios++;
  }
  if(cambios) guardarDB();
  return cambios;
}

function ubicDe(tag){
  const t = str(tag);
  let m = t.match(/\+1\.(B\d+(?:\.\d)?|U\d+|C\d+)/);
  if(m && UBIC[m[1]]) return { cod: m[1], desc: UBIC[m[1]][0], zona: UBIC[m[1]][1] };
  if(/EARTH|CUSTOMER/i.test(t)) return { cod:'EARTH', desc: UBIC.EARTH[0], zona:'campo' };
  if(/DCS|Cust\.Plant/i.test(t)) return { cod:'DCS', desc: UBIC.DCS[0], zona:'campo' };
  if(/CELDA(\d+)/i.test(t)){ const c = 'CELDA' + t.match(/CELDA(\d+)/i)[1]; return { cod:c, desc: (UBIC[c]||[c])[0], zona:'campo' }; }
  m = t.match(/\+1\.(\w+)/);
  return { cod: m ? m[1] : '', desc: m ? 'Ubicación +1.' + m[1] : 'Sin ubicación indicada', zona: 'ehouse' };
}

/* ---- Tensión de aislación por tipo de cable ---- */
function tensionCable(tipo){
  const t = str(tipo).toUpperCase();
  if(/3,6\/6|3\.6\/6/.test(t)) return '3,6 / 6 kV';
  if(/6,6 KV|6\.6 KV/.test(t)) return '6,6 kV';
  if(/NSGAF/.test(t)) return '1,8 / 3 kV (verificar hoja de datos)';
  if(/NSHXAFOEU|N2XH|RZ1|ÖLFLEX|OLFLEX/.test(t)) return '0,6 / 1 kV';
  if(/H07ZZ|H07RN/.test(t)) return '450 / 750 V';
  if(/JE-LIHCH|HSLCH|HSLH|LIHCH|HMH|PAAR|LI6Y/.test(t)) return '300 / 500 V (control)';
  if(/PROFIBUS|PROFINET|RJ45|IE |DP/.test(t)) return 'comunicación (80 V rms)';
  if(/FO|FOC|LWL|FIBRE|FIBER/.test(t)) return 'fibra óptica';
  return '—';
}

/* ---- Clasificación de cada cable ---- */
function clasificarCable(c){
  const tag = c[0], tipo = str(c[3]), cond = str(c[4]), cross = str(c[6]);
  const de = ubicDe(c[1]), a = ubicDe(c[2]);
  const campo = (de.zona === 'campo') || (a.zona === 'campo');
  const tU = tipo.toUpperCase();
  const esFO = /FO\b|FOC|LWL|FIBRE|FIBER/.test(tU) || cross === 'FO';
  const esPotMT = /NHXSGAFHXÖ|SISIF|NSGAF/.test(tU);
  const esLEM = /^K01-W(11|13|21|23)$/.test(tag) || /N11-W70/.test(tag);
  const esTierra = /RZ1-K|-W\d+E$/.test(tU + ' ' + tag) || /EARTH/i.test(c[1] + c[2]);

  let grupo, suministro, alcance, alcanceTxt, partida;
  if(/^C0[123]-W0[1-6]/.test(tag)) grupo = 'Fuerza — trafo convertidor → CCV (1.200 V)';
  else if(/^G[12][123]-W01\./.test(tag) || /^K01-W(1|2)\d\./.test(tag)) grupo = 'Fuerza — CCV → estator (baja frecuencia)';
  else if(/^E01-W0|^J01-W0[12]\.|^K01-W3\d\./.test(tag)) grupo = 'Excitación (trafo → rectificador → rotor)';
  else if(esTierra) grupo = 'Puesta a tierra';
  else if(esFO) grupo = 'Comunicaciones / fibra óptica';
  else if(/PROFIBUS|PROFINET|RJ45|IE FC|IE TP|^DP/.test(tU)) grupo = 'Comunicaciones / fibra óptica';
  else if(/^(H0|Z0|X5|X4|L\d|M0|J22|B5|B6|B7|B8)/.test(tag) && /H07|N2XH|ÖLFLEX|P5|P3|C1|C4/.test(tU + ' ' + tag)) grupo = 'SSAA / fuerza BT';
  else if(esLEM) grupo = 'Transductores LEM';
  else grupo = 'Control y señales';

  if(!campo){
    suministro = 'Innomotics (precableado en fábrica)';
    alcance = 'NO';
    alcanceTxt = 'Cable interno de la E-House: viene tendido y probado en fábrica (FAT en Santiago, ESPME-00001 etapa 2). El Contratista no lo tiende ni lo cambia; solo verifica que no haya sufrido daño en el transporte/armado y apoya al personal de integración de Innomotics (BT 6.2.19). Cualquier cambio lo define Innomotics.';
    partida = 'BT 6.2.19 Apoyo a la integración';
  }else if(esPotMT){
    suministro = 'CODELCO DAND (bodega KM7)';
    alcance = 'SÍ';
    alcanceTxt = 'Cable de potencia principal aportado por DAND (BT 10.4). El Contratista lo retira de bodega KM7, lo traslada, tiende por las escalerillas nuevas, confecciona terminales, conexiona en ambos extremos y ejecuta las pruebas (BT 4.2 "Montaje de cables, conexionado y pruebas", partidas 6.2.10, 6.2.11 terminales 500/350 MCM, 6.2.24 tendido). La conexión definitiva al molino se hace en la parada de planta (BT 5.7, tie-ins 6.2.18).';
    partida = 'BT 6.2.10 · 6.2.11 · 6.2.18 · 6.2.24';
  }else if(esFO){
    suministro = 'Contratista';
    alcance = 'SÍ';
    alcanceTxt = 'Fibra óptica de terreno: suministro, soportación, tendido, fusionado, conexionado y certificación por el Contratista (BT 4.2 "Suministro y montaje de F.O.", partidas 6.2.12 y 6.2.14). Nota del manual: "FO cables by FEAG" aplica a las fibras internas de los gabinetes, no a las de terreno.';
    partida = 'BT 6.2.12 · 6.2.14';
  }else if(esLEM){
    suministro = 'Contratista';
    alcance = 'SÍ';
    alcanceTxt = 'Cable de los transductores de corriente LEM del punto estrella: suministro e instalación por el Contratista (BT partida 6.2.15) según detalle de conexionado 300EL-0001. Debe tenderse a prueba de cortocircuito ("cables to be layed short-circuit proof", manual de cableado).';
    partida = 'BT 6.2.15';
  }else if(esTierra){
    suministro = 'Por confirmar (106EL: CODELCO · BT 6.2.13: Contratista)';
    alcance = 'SÍ';
    alcanceTxt = 'Conexión a la malla de tierra de planta: tendido y conexionado por el Contratista dentro de "Suministro, montaje de cables y pruebas" (BT 6.2.13). Verificar en el itemizado ECO-01 si el conductor lo aporta DAND o el Contratista.';
    partida = 'BT 6.2.13';
  }else{
    suministro = 'Por confirmar (106EL: CODELCO · BT 6.2.13: Contratista)';
    alcance = 'SÍ';
    alcanceTxt = 'Cable de control/señales entre la E-House y terreno: tendido, conexionado y pruebas por el Contratista (BT 4.2, partidas 6.2.13 y 6.2.24). La especificación 106EL-00001 indica que los cables los suministra CODELCO; el itemizado ECO-01 define si esta partida incluye suministro. Confirmar antes de comprar.';
    partida = 'BT 6.2.13 · 6.2.24';
  }
  return { tag:tag, de:de, a:a, campo:campo, grupo:grupo, suministro:suministro, alcance:alcance, alcanceTxt:alcanceTxt, partida:partida,
           tension: tensionCable(tipo), esPotMT: esPotMT, esFO: esFO };
}

let CIRC_CACHE = null;
function circuitos(){
  if(CIRC_CACHE) return CIRC_CACHE;
  const lista = CABLES_MANUAL.map(function(c){
    const k = clasificarCable(c);
    return { tag:c[0], desde:c[1], hasta:c[2], tipo:c[3], cond:c[4], usados:c[5], seccion:c[6], largo:c[7], funcion:c[8], hoja:c[9], k:k, retiro:false };

function condTexto(c){
  if(!c.cond && !c.seccion) return '—';
  const cond = str(c.cond), sec = str(c.seccion);
  if(sec === 'FO') return cond + ' fibra';
  return (cond ? cond + ' ' : '') + (sec ? '× ' + sec + ' mm²' : '');
}

/* ---- Requisitos técnicos según el tipo de circuito ---- */
function requisitosCirc(c){
  const k = c.k, r = [];
  if(k.esPotMT){
    r.push('Cable <b>unipolar, sin armadura y sin pantalla</b> (requisito CP-M0374-00-EE-EDC002 §3.1): un cable apantallado puede dañar el convertidor.');
    r.push('Tensión nominal mínima <b>3,6 / 6 kV</b> en todos los tramos: trafo → convertidor, convertidor → estator, trafo excitación → rectificador y rectificador → rotor (§3.5).');
    r.push('Sección máxima por conductor <b>240 mm² / 500 kcmil</b> (§3.3); conductor flexible <b>clase 5</b> IEC 60228 (§3.6); temperatura máxima del conductor <b>90 °C</b> (§3.7).');
    if(/trafo convertidor/.test(k.grupo)) r.push('Largo máximo <b>100 m</b> entre transformador del convertidor y convertidor; máximo <b>6 cables unipolares por fase</b> (§3.2).');
    else r.push('Largo máximo <b>150 m</b> entre convertidor y motor; máximo <b>7 cables unipolares por fase</b> (§3.2). Nota del unilineal: cables de igual largo.');
    r.push('Diferencia de largo entre cables de un mismo circuito <b>≤ 10 m</b>, para mantener la simetría del sistema (§3.2).');
    r.push('Tendido en <b>ternas L1-L2-L3 en trébol</b> sobre escalerilla, separación entre ternas ≥ 2 × diámetro (§3.8). Fijación con amarras/clamps no magnéticos.');
    r.push('Amarre y soportación dimensionados para esfuerzos de cortocircuito (§4.3); sellar extremos contra humedad durante el almacenamiento (§4.4).');
    r.push('Terminales: partida BT 6.2.11 "terminales de cable 500 MCM y 350 MCM"; torque según manual de cableado; medir aislación (megado) antes de conexionar y registrar en protocolo.');
    r.push('Tipo de referencia: SIENOPYR (N)HXSGAFHXÖ 3,6/6 kV (Pirelli/Prysmian) o SISIF-Cu 6,6 kV (motor); cualquier equivalente debe aprobarlo Innomotics.');
  }else if(k.esFO){
    r.push('Fibra según 106EL-00001 §3.3.2.4: <b>62,5/125 µm multimodo</b>, conectores ST/LC según equipo; para IBA usar 2 fibras dúplex.');
    r.push('Cabeceras (patch panels) y soportación en ambos extremos; radio de curvatura del fabricante; identificar cada fibra.');
    r.push('Fusionado y <b>certificación con OTDR / power meter</b> en ambos sentidos; entregar informe (BT 4.2 "certificación de fibra óptica").');
  }else if(/Comunicaciones/.test(k.grupo)){
    r.push('Profibus: cable violeta 2 hilos apantallado, impedancia 150 Ω, radio mínimo 60/80 mm, pantalla a tierra en un punto (106EL §3.3.2.1). Profinet/LAN: CAT 6A 4×2 con RJ45 industriales (§3.3.2.2 / 3.3.2.3).');
    r.push('Respetar largos máximos del bus y terminaciones activas; probar con analizador de bus antes de la integración.');
  }else if(/Control|LEM/.test(k.grupo)){
    r.push('Cable de control multiconductor libre de halógenos, cobre clase 5, chaqueta HSLCH-JZ / JE-LiHCH según manual; 300/500 V (106EL §3.3.1).');
    r.push('Calibre mínimo entre sala eléctrica y terreno <b>#14 AWG</b>; #16/#18 AWG solo dentro de la misma sala (106EL §3.3.1).');
    r.push('Pantallas a tierra en <b>un solo punto</b>; sin uniones en el recorrido; radio mínimo 10 × diámetro fijo (106EL §3.1 / 3.3.1).');
    if(/LEM/.test(k.grupo)) r.push('Tender a prueba de cortocircuito y separado de los cables de potencia; conexionado según ' + refDoc('4502319491-03221-300EL-0001', '300EL-0001') + '.');
  }else if(/tierra/.test(k.grupo)){
    r.push('Conductor RZ1-K 1×70 mm² a la malla de planta; conexión con terminal y prueba de continuidad / resistencia de puesta a tierra registrada.');
  }else if(c.retiro){
    r.push('Bloqueo eléctrico y mecánico (LOTO) y verificación de ausencia de tensión antes de intervenir (BT 4.3.4, Reglamento de Seguridad Eléctrica DAND).');
    r.push('Identificar y etiquetar ambos extremos antes de cortar; registrar en red-line qué se retira.');
    r.push('Disposición final en patio de chatarra de la División; normalizar escalerillas y sellos (BT 5.8, partida 6.2.20).');
  }else{
    r.push('Cable libre de halógenos, retardante a la llama; sin uniones en ductos; pantallas a tierra en un solo punto (106EL §3.1).');
  }
  r.push('Probar y protocolizar: continuidad, megado, identificación de fases/hilos y torque de bornes antes de la energización (BT 4.2 "Puesta en servicio").');
  return r;
}

const ADMIN = { activo:false, token:'' };
const ADMIN_SESION_KEY = 'ccv_admin_sesion';
const ADMIN_TOKEN_KEY = 'ccv_admin_token';   /* token para escribir en el servicio de datos compartidos */

/* Funciones que modifican datos: se envuelven para exigir el modo administrador */
const FUNCIONES_EDICION = [
  'formDocumento','guardarDocumento','eliminarDoc','nuevaRevision','guardarNuevaRevision','eliminarRevision',
  'formComentario','guardarComentario','eliminarComentario',

/* SHA-256 (WebCrypto si existe; si no, implementación propia para file://) */
function sha256Hex(texto){
  const bytes = new TextEncoder().encode(texto);
  if(window.crypto && crypto.subtle && crypto.subtle.digest){
    return crypto.subtle.digest('SHA-256', bytes).then(function(buf){
      return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
    }).catch(function(){ return Promise.resolve(sha256JS(bytes)); });
  }
  return Promise.resolve(sha256JS(bytes));
}
function sha256JS(m){
  const KK = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = m.length, bitLen = l * 8;
  const padLen = ((l + 9 + 63) >> 6) << 6;
  const p = new Uint8Array(padLen); p.set(m); p[l] = 0x80;
  p[padLen-4] = (bitLen >>> 24) & 255; p[padLen-3] = (bitLen >>> 16) & 255; p[padLen-2] = (bitLen >>> 8) & 255; p[padLen-1] = bitLen & 255;
  const w = new Array(64);
  function rotr(x,n){ return (x >>> n) | (x << (32-n)); }
  for(let i=0;i<padLen;i+=64){
    for(let t=0;t<16;t++) w[t] = (p[i+t*4]<<24) | (p[i+t*4+1]<<16) | (p[i+t*4+2]<<8) | p[i+t*4+3];
    for(let t=16;t<64;t++){
      const s0 = rotr(w[t-15],7) ^ rotr(w[t-15],18) ^ (w[t-15]>>>3);
      const s1 = rotr(w[t-2],17) ^ rotr(w[t-2],19) ^ (w[t-2]>>>10);
      w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
    }
    let a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(let t=0;t<64;t++){
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + KK[t] + w[t]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      h=g; g=f; f=e; e=(d + t1)>>>0; d=c; c=b; b=a; a=(t1 + t2)>>>0;
    }
    H = [(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(function(x){ return ('00000000' + x.toString(16)).slice(-8); }).join('');
}

/* Oculta los controles de edición cuando la app está en modo lectura */
function aplicarModoLectura(raiz){
  document.body.classList.toggle('lectura', !ADMIN.activo);
  const b = document.getElementById('adminBtn');
  if(b){
    b.textContent = ADMIN.activo ? '🔓 Administrador' : '🔒 Lectura';

  }
  if(ADMIN.activo) return;
  const re = new RegExp('^\\s*(' + FUNCIONES_EDICION.join('|') + ')\\s*\\(');
  $$('[onclick]', raiz || document).forEach(function(el){
    if(re.test(el.getAttribute('onclick') || '')) el.classList.add('solo-admin');
  });
}
function bloqueoLectura(){
  toast('🔒 La aplicación está en <b>modo lectura</b>. Ingrese la clave de administrador (botón 🔒 arriba) para editar.', 'bad', 5000);
}
function instalarGuardias(){
  FUNCIONES_EDICION.forEach(function(nombre){
    const original = window[nombre];
    if(typeof original !== 'function') return;
    window[nombre] = function(){
      if(!ADMIN.activo){ bloqueoLectura(); return; }

    };
  });
}
function dialogoAdmin(){
  if(ADMIN.activo){
    ADMIN.activo = false; ADMIN.token = '';
    try{ sessionStorage.removeItem(ADMIN_SESION_KEY); sessionStorage.removeItem(ADMIN_TOKEN_KEY); }catch(e){}
    cerrarModal(); render(); toast('Modo lectura activado.', 'ok');
    return;
  }
  abrirModal(
    '<div class="modal-head"><h2>🔒 Clave de administrador</h2><button class="x" onclick="cerrarModal()" aria-label="Cerrar">×</button></div>' +
    '<div class="modal-body">' +
      '<p class="sub" style="margin-bottom:12px">La aplicación se abre en <b>modo lectura</b>: cualquiera puede consultar la matriz, abrir planos y usar los simuladores, pero nadie puede crear, editar ni borrar registros. ' +
      'Con la clave de administrador se habilita la edición en esta pestaña.</p>' +
      '<div class="field"><label class="f" for="adminClave">Clave</label>' +
      '<input class="inp" id="adminClave" type="password" autocomplete="current-password" placeholder="Ingrese la clave"></div>' +
      '<div id="adminMsg" class="sub" style="margin:0;color:var(--bad)"></div>' +
    '</div>' +
    '<div class="modal-foot"><button class="btn" onclick="cerrarModal()">Cancelar</button>' +
    '<button class="btn primary" id="adminOk">Habilitar edición</button></div>', 'narrow');
  const inp = document.getElementById('adminClave');
  const ok = document.getElementById('adminOk');
  function intentar(){
    const v = inp.value;
    if(!v){ inp.focus(); return; }
    ok.disabled = true;
    sha256Hex(v).then(function(h){
      if(h === ADMIN_HASH){
        ADMIN.activo = true;
        try{ sessionStorage.setItem(ADMIN_SESION_KEY, h); }catch(e){}
        sha256Hex('ccv-servidor|' + v).then(function(tk){ ADMIN.token = tk; try{ sessionStorage.setItem(ADMIN_TOKEN_KEY, tk); }catch(e){}
          if(typeof subirPrograma === 'function' && DB.programa && DB.programa.pendiente) subirPrograma(); });
        cerrarModal(); render(); toast('🔓 Edición habilitada para esta pestaña. Pulse el botón de administrador para volver a bloquear.', 'ok', 6000);
      }else{
        ok.disabled = false; inp.value = ''; inp.focus();
        document.getElementById('adminMsg').textContent = 'Clave incorrecta.';
      }
    });
  }
  ok.addEventListener('click', intentar);
  inp.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') intentar(); });
  inp.focus();
}
function initAdmin(){
  try{ if(sessionStorage.getItem(ADMIN_SESION_KEY) === ADMIN_HASH){ ADMIN.activo = true; ADMIN.token = sessionStorage.getItem(ADMIN_TOKEN_KEY) || ''; } }catch(e){}
  instalarGuardias();
  const b = document.getElementById('adminBtn');
  if(b) b.addEventListener('click', dialogoAdmin);
  aplicarModoLectura(document);
}
/* ==================================================================
   ===============   02 CALIDAD — CARPETA EN GOOGLE DRIVE  ==========
   ==================================================================
   La carpeta de calidad (PIE / ITP / protocolos / dossier) vive en
   Google Drive y la administra el encargado de calidad. Este módulo
   la muestra en modo LECTURA y se navega como en Drive, sin salir de
   la app:
     · un servicio de solo lectura (Apps Script, CALIDAD_SERVICIO_URL)
       entrega el árbol completo de la carpeta en JSON;
     · subcarpetas, ruta (migas de pan), buscador, orden y visor
       integrado (Drive preview) para PDF, Office, Google Docs, imágenes;
     · se relee al abrir el módulo, con ↻ y cada 5 minutos;
     · nada se guarda ni se modifica: los permisos son los de Drive.
   Si el servicio no responde, se muestra la vista incrustada de Drive.
   ================================================================== */

const CALIDAD_SERVICIO_URL = 'https://script.google.com/macros/s/AKfycbxdRWFXlNa-1OIrSc1dOB3B8AJz5yBF6kxV05BHWVzXY1ElIJ9YKXCv7qXglXJ10MnzoQ/exec';
const CALIDAD_REFRESCO_MS = 5 * 60 * 1000;
const CALIDAD = { arbol:null, hora:null, error:'', cargando:false, carpetaId:'', vista:'lista', orden:'nombre', buscar:'', doc:null, timer:null };

function idCarpetaDrive(url){
  const m = str(url).match(/folders\/([A-Za-z0-9_-]{10,})/) || str(url).match(/[?&]id=([A-Za-z0-9_-]{10,})/);
  return m ? m[1] : '';
}
function urlCarpetaCalidad(){ return str(DB.contrato.carpetaCalidad || CARPETA_CALIDAD_URL).trim(); }
function servicioCalidad(){ return str(DB.contrato.servicioCalidad || CALIDAD_SERVICIO_URL).trim(); }
function servicioCalidadOK(){ const u = servicioCalidad(); return /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(u); }

/* ---------- carga del árbol ---------- */
function cargarCalidad(forzar){
  if(!servicioCalidadOK()){ CALIDAD.error = 'sin-servicio'; return Promise.resolve(); }
  if(CALIDAD.cargando) return Promise.resolve();
  CALIDAD.cargando = true; CALIDAD.error = '';
  pintarCalidad();
  const u = servicioCalidad() + (servicioCalidad().indexOf('?') > 0 ? '&' : '?') + 't=' + Date.now();
  return fetch(u, { method:'GET', redirect:'follow', cache:'no-store' })
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      if(!j || !j.ok) throw new Error((j && j.error) || 'Respuesta inválida');
      CALIDAD.arbol = j.arbol; CALIDAD.hora = new Date(); CALIDAD.total = j.total;
      if(!CALIDAD.carpetaId || !buscarCarpeta(CALIDAD.arbol, CALIDAD.carpetaId)) CALIDAD.carpetaId = j.arbol.id;
    })
    .catch(function(e){ CALIDAD.error = String(e && e.message || e); })
    .then(function(){ CALIDAD.cargando = false; pintarCalidad(); });
}
function buscarCarpeta(nodo, id, ruta){
  ruta = ruta || [];
  if(!nodo) return null;
  if(nodo.id === id) return { nodo:nodo, ruta:ruta.concat([nodo]) };
  for(let i=0; i<(nodo.carpetas||[]).length; i++){
    const r = buscarCarpeta(nodo.carpetas[i], id, ruta.concat([nodo]));
    if(r) return r;
  }
  return null;
}
function todosLosArchivos(nodo, ruta, acc){
  acc = acc || []; ruta = ruta || [];
  (nodo.archivos||[]).forEach(function(a){ acc.push({ a:a, ruta:ruta.concat([nodo]) }); });
  (nodo.carpetas||[]).forEach(function(c){ todosLosArchivos(c, ruta.concat([nodo]), acc); });
  return acc;
}

/* ---------- tipos, íconos y visor ---------- */
function tipoArchivo(mime, nombre){
  mime = str(mime); const ext = (str(nombre).match(/\.([a-z0-9]+)$/i) || ['',''])[1].toLowerCase();
  if(mime === 'application/pdf' || ext === 'pdf') return { ico:'📄', label:'PDF', prev:'drive' };
  if(mime === 'application/vnd.google-apps.document') return { ico:'📝', label:'Google Docs', prev:'gdoc' };
  if(mime === 'application/vnd.google-apps.spreadsheet') return { ico:'📊', label:'Google Sheets', prev:'gsheet' };
  if(mime === 'application/vnd.google-apps.presentation') return { ico:'📽️', label:'Google Slides', prev:'gslides' };
  if(mime === 'application/vnd.google-apps.folder') return { ico:'📁', label:'Carpeta', prev:'' };
  if(/word|officedocument\.word|msword/.test(mime) || /^docx?$/.test(ext)) return { ico:'📝', label:'Word', prev:'drive' };
  if(/excel|spreadsheetml|ms-excel/.test(mime) || /^xlsx?$|^xlsm$|^csv$/.test(ext)) return { ico:'📊', label:'Excel', prev:'drive' };
  if(/powerpoint|presentationml/.test(mime) || /^pptx?$/.test(ext)) return { ico:'📽️', label:'PowerPoint', prev:'drive' };
  if(/^image\//.test(mime)) return { ico:'🖼️', label:'Imagen', prev:'drive' };
  if(/^video\//.test(mime)) return { ico:'🎬', label:'Video', prev:'drive' };
  if(/dwg|dxf|acad/.test(mime) || /^dwg$|^dxf$/.test(ext)) return { ico:'📐', label:'CAD', prev:'' };
  if(/zip|rar|7z|compressed/.test(mime) || /^zip$|^rar$|^7z$/.test(ext)) return { ico:'🗜️', label:'Comprimido', prev:'' };
  if(/^text\//.test(mime) || ext === 'txt') return { ico:'📃', label:'Texto', prev:'drive' };
  return { ico:'📎', label: ext ? ext.toUpperCase() : 'Archivo', prev:'drive' };
}
function urlVisor(a){
  const t = tipoArchivo(a.mime, a.nombre);
  if(t.prev === 'gdoc')    return 'https://docs.google.com/document/d/' + a.id + '/preview';
  if(t.prev === 'gsheet')  return 'https://docs.google.com/spreadsheets/d/' + a.id + '/preview';
  if(t.prev === 'gslides') return 'https://docs.google.com/presentation/d/' + a.id + '/preview';
  if(t.prev === 'drive')   return 'https://drive.google.com/file/d/' + a.id + '/preview';
  return '';
}
function fmtTam(n){
  n = Number(n) || 0;
  if(!n) return '—';
  if(n < 1024) return n + ' B';
  if(n < 1048576) return (n/1024).toFixed(0) + ' kB';
  if(n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
function fmtFechaHora(iso){
  const d = new Date(iso); if(isNaN(d.getTime())) return '—';
  return pad(d.getDate()) + '-' + pad(d.getMonth()+1) + '-' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

function cuerpoCalidad(){
  const urlDrive = urlCarpetaCalidad();
  if(!servicioCalidadOK() || (CALIDAD.error && !CALIDAD.arbol)) return cuerpoCalidadEmbebido(urlDrive);
  if(!CALIDAD.arbol) return '<div class="card card-pad" style="text-align:center;color:var(--text-2)">Leyendo la carpeta de calidad en Google Drive…</div>';

  const enc = buscarCarpeta(CALIDAD.arbol, CALIDAD.carpetaId) || { nodo:CALIDAD.arbol, ruta:[CALIDAD.arbol] };
  const nodo = enc.nodo, ruta = enc.ruta;
  const q = CALIDAD.buscar.trim().toLowerCase();

  /* barra superior */
  let h = '<div class="toolbar">';
  h += '<a class="btn" href="' + attr(urlDrive) + '" target="_blank" rel="noopener" title="Abrir la carpeta en Google Drive (pestaña nueva)">▲ Ver en Drive</a>';
  h += '<button class="btn" onclick="cargarCalidad(true)" title="Volver a leer la carpeta"' + (CALIDAD.cargando ? ' disabled' : '') + '>↻ ' + (CALIDAD.cargando ? 'Leyendo…' : 'Actualizar') + '</button>';
  h += '<span class="search" style="flex:0 1 320px"><span class="mag">⌕</span><input class="inp" id="calidadBuscar" type="search" placeholder="Buscar en toda la carpeta…" value="' + attr(CALIDAD.buscar) + '" oninput="buscarCalidad(this.value)" style="padding-left:30px"></span>';
  h += '<span class="spacer"></span>';
  h += '<span style="font-size:12px;color:var(--text-2)">Vista:</span>' +
       '<button class="btn sm' + (CALIDAD.vista === 'lista' ? ' primary' : '') + '" onclick="vistaCalidad(\'lista\')">☰ Lista</button>' +
       '<button class="btn sm' + (CALIDAD.vista === 'cuadricula' ? ' primary' : '') + '" onclick="vistaCalidad(\'cuadricula\')">▦ Cuadrícula</button>';
  h += '<span style="font-size:11.5px;color:var(--text-3);margin-left:8px">' + (CALIDAD.hora ? 'Leída a las ' + pad(CALIDAD.hora.getHours()) + ':' + pad(CALIDAD.hora.getMinutes()) : '') +
       (CALIDAD.error ? ' · <span style="color:var(--bad)">sin conexión, mostrando la última lectura</span>' : '') + '</span>';
  h += '</div>';

  /* migas de pan */
  h += '<div class="migas">';
  ruta.forEach(function(c, i){
    const ultimo = (i === ruta.length - 1);
    h += (i ? '<span class="sep">›</span>' : '') +
         (ultimo && !q ? '<b>' + esc(i === 0 ? 'Calidad' : c.nombre) + '</b>' : '<a href="javascript:void 0" onclick="irCarpetaCalidad(\'' + attr(c.id) + '\')">' + esc(i === 0 ? 'Calidad' : c.nombre) + '</a>');
  });
  if(q) h += '<span class="sep">›</span><b>Resultados de "' + esc(CALIDAD.buscar.trim()) + '"</b>';
  h += '</div>';

  /* contenido */
  let carpetas = [], archivos = [];
  if(q){
    const todos = todosLosArchivos(CALIDAD.arbol);
    archivos = todos.filter(function(x){ return x.a.nombre.toLowerCase().indexOf(q) >= 0; });
    const cs = []; (function rec(n, r){ (n.carpetas||[]).forEach(function(c){ if(c.nombre.toLowerCase().indexOf(q) >= 0) cs.push({ c:c, ruta:r.concat([n]) }); rec(c, r.concat([n])); }); })(CALIDAD.arbol, []);
    carpetas = cs;
  }else{
    carpetas = (nodo.carpetas||[]).map(function(c){ return { c:c, ruta:ruta }; });
    archivos = (nodo.archivos||[]).map(function(a){ return { a:a, ruta:ruta }; });
  }
  const ord = CALIDAD.orden;
  const cmp = function(x, y){
    if(ord === 'fecha') return String(y.mod).localeCompare(String(x.mod));
    if(ord === 'tam') return (Number(y.tam)||0) - (Number(x.tam)||0);
    return String(x.nombre).localeCompare(String(y.nombre), 'es');
  };
  carpetas.sort(function(x,y){ return cmp(x.c, y.c); }); archivos.sort(function(x,y){ return cmp(x.a, y.a); });

  if(!carpetas.length && !archivos.length){
    h += '<div class="card"><div class="empty-state"><div class="big">📂</div>' + (q ? 'Ningún documento coincide con la búsqueda.' : 'Esta carpeta está vacía.') + '</div></div>';
  }else if(CALIDAD.vista === 'cuadricula'){
    h += '<div class="drv-grid">';
    carpetas.forEach(function(x){
      h += '<div class="drv-card" ondblclick="irCarpetaCalidad(\'' + attr(x.c.id) + '\')" onclick="irCarpetaCalidad(\'' + attr(x.c.id) + '\')" title="Abrir carpeta">' +
