/* ==================================================================
   ===============   05 PLANIFICACIÓN Y AVANCE            ===========
   ==================================================================
   Programa de montaje (MS Project, Rev. CLG 29-09) convertido a datos
   (part13data.js) y trabajado desde la app:
     5.1 Carta Gantt navegable (etapas, actividades, hitos, filtros)
     5.2 Avance físico: % real por actividad, curva S plan vs. real
     5.3 Hitos contractuales con estado
     5.4 Restricciones y desviaciones
     5.5 Informe semanal imprimible
   El programa (fechas plan) es de solo lectura; lo que se registra
   (avance real, restricciones, fecha de corte) vive en DB.programa y
   requiere modo administrador.
   ================================================================== */

/* ---------- datos compartidos (servicio Apps Script, clave "programa") ----------
   Lo que se registra en este módulo se guarda en el navegador (DB) y ADEMÁS se sube
   al servicio de datos compartidos, para que todos vean el mismo avance. Al abrir el
   módulo se descarga la última versión. Escribir requiere el token de administrador. */
const SINC = { estado:'', hora:null, version:0, error:'', pendiente:false, ultimaLectura:0 };
function servicioDatos(){ return (typeof servicioCalidad === 'function') ? servicioCalidad() : ''; }
function servicioDatosOK(){ return (typeof servicioCalidadOK === 'function') && servicioCalidadOK(); }
function bajarPrograma(forzar){
  if(!servicioDatosOK()) return Promise.resolve(false);
  if(!forzar && Date.now() - SINC.ultimaLectura < 45000) return Promise.resolve(false);
  SINC.ultimaLectura = Date.now(); SINC.estado = 'leyendo'; pintarSinc();
  return fetch(servicioDatos() + '?accion=leer&clave=programa&t=' + Date.now(), { redirect:'follow', cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) throw new Error((j && j.error) || 'respuesta inválida');
      SINC.error = ''; SINC.hora = new Date(); SINC.version = j.version || 0;
      if(DB.programa.pendiente){
        /* hay registros locales que aún no se han subido: nunca se pisan. Se combinan con lo
           compartido (gana el registro más reciente) y, si hay token, se suben ahora. */
        if(j.datos) DB.programa = combinarPrograma(normalizarPrograma(j.datos), DB.programa, j.version || 0);
        guardarDB();
        if(ADMIN.token) return subirPrograma();
        SINC.estado = 'error'; SINC.error = 'hay registros sin sincronizar: ingrese la clave de administrador para subirlos'; SINC.pendiente = true; pintarSinc(); return false;
      }
      if(j.datos && (j.version || 0) >= (DB.programa.version || 0)){
        const nuevo = normalizarPrograma(j.datos); nuevo.version = j.version || 0;
        const cambio = JSON.stringify(nuevo) !== JSON.stringify(DB.programa);
        if(cambio){ DB.programa = nuevo; guardarDB(); if(/^plan/.test(ESTADO_UI.ruta) && !document.querySelector('#modalRoot .modal')) render(); }
      }
      SINC.estado = 'ok'; pintarSinc(); return true;
    })
    .catch(function(e){ SINC.estado = 'error'; SINC.error = String(e && e.message || e); pintarSinc(); return false; });
}
/* Combina lo compartido (base) con lo local no subido: por actividad gana el registro con fecha
   de registro más reciente; las restricciones se unen por id; los cortes se unen. */
function combinarPrograma(base, local, version){
  const r = normalizarPrograma(base);
  Object.keys(local.avances || {}).forEach(function(k){
    const a = local.avances[k], b = r.avances[k];
    if(!b || (a.fecha || '') >= (b.fecha || '')) r.avances[k] = a;
  });
  Object.keys(local.cortes || {}).forEach(function(f){ if(!(f in r.cortes)) r.cortes[f] = local.cortes[f]; });
  (local.restricciones || []).forEach(function(x){
    const i = r.restricciones.map(function(y){ return y.id; }).indexOf(x.id);
    if(i >= 0) r.restricciones[i] = x; else r.restricciones.push(x);
  });
  if(local.fechaCorte && (!r.fechaCorte || local.fechaCorte > r.fechaCorte)) r.fechaCorte = local.fechaCorte;
  r.version = version; r.pendiente = true;
  return r;
}
function subirPrograma(){
  if(!servicioDatosOK()) return Promise.resolve(false);
  if(!ADMIN.token){ DB.programa.pendiente = true; guardarDB(); SINC.estado = 'error'; SINC.error = 'hay registros sin sincronizar: ingrese la clave de administrador (botón 🔒) para subirlos'; SINC.pendiente = true; pintarSinc(); return Promise.resolve(false); }
  SINC.estado = 'subiendo'; pintarSinc();
  const datos = JSON.parse(JSON.stringify(DB.programa)); delete datos.version; delete datos.pendiente;
  return fetch(servicioDatos(), { method:'POST', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion:'guardar', clave:'programa', token:ADMIN.token, datos:datos, por:(DB.contrato.jefeOT || '') }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || !j.ok) throw new Error((j && j.error) || 'respuesta inválida');
      DB.programa.version = j.version || 0; DB.programa.pendiente = false; guardarDB();
      SINC.estado = 'ok'; SINC.error = ''; SINC.pendiente = false; SINC.hora = new Date(); SINC.version = j.version || 0; pintarSinc();
      toast('Avance sincronizado para todos (versión ' + SINC.version + ').', 'ok', 2500); return true;
    })
    .catch(function(e){ DB.programa.pendiente = true; guardarDB(); SINC.estado = 'error'; SINC.error = String(e && e.message || e); SINC.pendiente = true; pintarSinc();
      toast('Guardado en este navegador, pero no se pudo sincronizar (' + esc(SINC.error) + '). Se reintentará al guardar de nuevo.', 'bad', 6000); return false; });
}
function guardarPrograma(){ DB.programa.pendiente = true; guardarDB(); subirPrograma(); }
function pintarSinc(){
  const el = document.getElementById('sincEstado'); if(!el) return;
  el.innerHTML = textoSinc();
}
function textoSinc(){
  if(!servicioDatosOK()) return '<span class="pill neutral" title="Sin servicio de datos configurado: los registros quedan solo en este navegador">solo local</span>';
  const h = SINC.hora ? pad(SINC.hora.getHours()) + ':' + pad(SINC.hora.getMinutes()) : '';
  if(SINC.estado === 'leyendo') return '<span class="pill neutral">⟳ leyendo datos compartidos…</span>';
  if(SINC.estado === 'subiendo') return '<span class="pill neutral">⟳ sincronizando…</span>';
  if(SINC.estado === 'error') return '<span class="pill bad" title="' + attr(SINC.error) + '">⚠ sin sincronizar' + (SINC.pendiente ? ' (pendiente)' : '') + '</span> <button class="btn sm" onclick="reintentarSinc()">Reintentar</button>';
  if(SINC.estado === 'ok') return '<span class="pill ok" title="Datos compartidos por todos los usuarios">✓ compartido · v' + SINC.version + (h ? ' · ' + h : '') + '</span>';
  return '';
}
function reintentarSinc(){ if(SINC.pendiente && ADMIN.activo) subirPrograma(); else bajarPrograma(true); }

/* ---------- índice del programa ---------- */
const PRG = (function(){
  const porUID = {}, hijos = {};
  PROGRAMA_TAREAS.forEach(function(t){ porUID[t.u] = t; hijos[t.u] = []; });
  PROGRAMA_TAREAS.forEach(function(t){ if(t.p && hijos[t.p]) hijos[t.p].push(t); });
  const raiz = PROGRAMA_TAREAS.filter(function(t){ return t.l === 1; })[0];
  const etapas = PROGRAMA_TAREAS.filter(function(t){ return t.l === 2; });
  const hojas = PROGRAMA_TAREAS.filter(function(t){ return !t.S; });
  const hitos = hojas.filter(function(t){ return t.M; });
  const sucesores = {};
  PROGRAMA_TAREAS.forEach(function(t){ (t.L||[]).forEach(function(l){ (sucesores[l.p] = sucesores[l.p] || []).push({ t:t, tipo:l.t, lag:l.g }); }); });
  const etapaIdx = {}; etapas.forEach(function(e, i){ etapaIdx[e.u] = i; });
  const ini = hojas.map(function(t){ return t.s; }).sort()[0], fin = hojas.map(function(t){ return t.f; }).sort().slice(-1)[0];
  return { porUID:porUID, hijos:hijos, raiz:raiz, etapas:etapas, hojas:hojas, hitos:hitos, sucesores:sucesores, etapaIdx:etapaIdx, inicio:ini, fin:fin };
})();
const PRG_COLORES = ['#526075','#17658d','#835520','#386c50','#76528b','#006c73','#2855a1','#96413c','#5c6530','#79516c'];
const PRG_UI = { escala:'meses', buscar:'', etapa:'', recurso:'', estado:'', criticas:false, colapsadas:null, filtroAvance:'atrasadas' };
const TIPOS_RESTR = ['Restricción','Desviación de plazo','Cambio de alcance','Interferencia','Falta de suministro','Clima / fuerza mayor','Otro'];
const EST_RESTR = ['Abierta','En gestión','Cerrada'];

/* ---------- fechas ---------- */
function prgFecha(iso){ return iso ? new Date(iso.slice(0,10) + 'T00:00:00') : null; }
function prgMs(iso){ const d = prgFecha(iso); return d ? d.getTime() : 0; }
function prgISO(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function fmtCorta(iso){ if(!iso) return '—'; const d = prgFecha(iso); const M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate() + ' ' + M[d.getMonth()] + ' ' + d.getFullYear(); }
function fechaCorte(){ return DB.programa.fechaCorte || hoyISO(); }
function colorEtapa(t){ return PRG_COLORES[PRG.etapaIdx[t.ph]] || '#365970'; }
function nombreEtapa(t){ const i = PRG.etapaIdx[t.ph]; return i == null ? '—' : String(i+1).padStart(2,'0') + ' · ' + PROGRAMA_ETAPAS_META[i][1]; }
function fmtH(h){ return Number(h).toLocaleString('es-CL', { maximumFractionDigits:1 }) + ' h'; }
function fmtDias(h){ return Number(h / 8).toLocaleString('es-CL', { maximumFractionDigits:1 }) + ' d'; }

/* ---------- avance ---------- */
function avanceDe(t){ return DB.programa.avances[t.u] || null; }
function pesoHoja(t){ if(t.M) return 0; return t.k > 0 ? t.k : (t.d > 0 ? t.d : 0); }
function descendientesHoja(t){
  if(!t.S) return [t];
  let acc = []; (PRG.hijos[t.u]||[]).forEach(function(h){ acc = acc.concat(descendientesHoja(h)); }); return acc;
}
function pctRealHoja(t){ const a = avanceDe(t); if(a) return a.pct; return 0; }
function pctPlanHoja(t, corteISO){
  const c = prgMs(corteISO) + 86400000, s = prgMs(t.s), f = prgMs(t.f) + 86400000;
  if(c <= s) return 0; if(c >= f) return 100;
  return Math.round((c - s) / (f - s) * 1000) / 10;
}
function pctPonderado(t, fn){
  const hojas = descendientesHoja(t);
  let pesoT = 0, acum = 0, n = 0, sum = 0;
  hojas.forEach(function(h){ const w = pesoHoja(h); const v = fn(h); if(w > 0){ pesoT += w; acum += w * v; } n++; sum += v; });
  if(pesoT > 0) return Math.round(acum / pesoT * 10) / 10;
  return n ? Math.round(sum / n * 10) / 10 : 0;
}
function pctReal(t){ return t.S ? pctPonderado(t, pctRealHoja) : pctRealHoja(t); }
function pctPlan(t, corte){ corte = corte || fechaCorte(); return t.S ? pctPonderado(t, function(h){ return pctPlanHoja(h, corte); }) : pctPlanHoja(t, corte); }
function estadoActividad(t, corte){
  corte = corte || fechaCorte();
  const a = avanceDe(t), real = pctRealHoja(t), plan = pctPlanHoja(t, corte);
  if(t.M){
    if(a && (a.finReal || a.pct >= 100)) return { id:'completada', label:'Cumplido', cls:'aprobado' };
    return prgMs(t.f) < prgMs(corte) ? { id:'atrasada', label:'Vencido', cls:'rechazado' } : { id:'pendiente', label:'Pendiente', cls:'recibido' };
  }
  if(real >= 100) return { id:'completada', label:'Completada', cls:'aprobado' };
  if(plan > 0 && real + 0.05 < plan) return { id:'atrasada', label:'Atrasada', cls:'rechazado' };
  if(real > 0) return { id:'curso', label:'En curso', cls:'revision' };
  if(plan > 0) return { id:'atrasada', label:'Atrasada', cls:'rechazado' };
  return { id:'pendiente', label:'No iniciada', cls:'recibido' };
}
function totalReal(){ return pctReal(PRG.raiz); }
function totalPlan(corte){ return pctPlan(PRG.raiz, corte); }
function registrarCorte(){ DB.programa.cortes[fechaCorte()] = totalReal(); }

/* ---------- ficha de actividad ---------- */
function fichaActividad(uid){
  const t = PRG.porUID[uid]; if(!t) return;
  const a = avanceDe(t), est = estadoActividad(t), ruta = [];
  let p = PRG.porUID[t.p]; while(p){ ruta.unshift(p.n); p = PRG.porUID[p.p]; }
  const tipos = { '0':'FF fin–fin', '1':'FI fin–inicio', '2':'IF inicio–fin', '3':'II inicio–inicio' };
  const pred = (t.L||[]).map(function(l){ const q = PRG.porUID[l.p]; return q ? '<li><a href="javascript:void 0" onclick="fichaActividad(\'' + q.u + '\')">#' + esc(q.i) + ' ' + esc(q.n) + '</a> <span class="tag">' + (tipos[l.t]||l.t) + (l.g ? ' ' + (l.g>0?'+':'') + Math.round(l.g/PROGRAMA_META.minDia*10)/10 + ' d' : '') + '</span></li>' : ''; }).join('');
  const suc = (PRG.sucesores[t.u]||[]).map(function(s){ return '<li><a href="javascript:void 0" onclick="fichaActividad(\'' + s.t.u + '\')">#' + esc(s.t.i) + ' ' + esc(s.t.n) + '</a> <span class="tag">' + (tipos[s.tipo]||s.tipo) + '</span></li>'; }).join('');
  const hijos = t.S ? (PRG.hijos[t.u]||[]) : [];
  abrirModal(
    '<div class="modal-head"><div><div class="sub" style="margin:0 0 2px;font-size:11.5px">' + esc(ruta.join(' › ')) + '</div><h2>' + (t.M ? '◆ ' : t.S ? '▣ ' : '') + esc(t.n) + '</h2></div>' +
      pillEstado2(est) + '<button class="x" onclick="cerrarModal()" aria-label="Cerrar">×</button></div>' +
    '<div class="modal-body">' +
      '<div class="dl">' +
        '<dt>ID · EDT</dt><dd>#' + esc(t.i) + ' · ' + esc(t.w) + '</dd>' +
        '<dt>Etapa</dt><dd><span class="tag" style="background:' + colorEtapa(t) + ';color:#fff">' + esc(nombreEtapa(t)) + '</span></dd>' +
        '<dt>Inicio · término plan</dt><dd>' + fmtCorta(t.s) + ' → ' + fmtCorta(t.f) + (t.M ? ' (hito)' : '') + '</dd>' +

function filasGantt(){
  if(PRG_UI.colapsadas === null){ PRG_UI.colapsadas = {}; PROGRAMA_TAREAS.forEach(function(t){ if(t.S && t.l >= 3) PRG_UI.colapsadas[t.u] = true; }); }

  const filtrando = !!(q || PRG_UI.etapa || PRG_UI.recurso || PRG_UI.estado || PRG_UI.criticas);
  function pasa(t){
    if(q && (t.n.toLowerCase().indexOf(q) < 0 && t.i !== q.replace('#','') && t.w.indexOf(q) !== 0)) return false;
    if(PRG_UI.etapa && t.ph !== PRG_UI.etapa && t.u !== PRG_UI.etapa) return false;
    if(PRG_UI.recurso && (t.r||[]).indexOf(PRG_UI.recurso) < 0) return false;
    if(PRG_UI.estado && estadoActividad(t, corte).id !== PRG_UI.estado) return false;
    if(PRG_UI.criticas && !t.C) return false;
    return true;
  }
  const out = [];
  if(filtrando){
    PROGRAMA_TAREAS.forEach(function(t){ if(!t.S && pasa(t)) out.push(t); });
    return out;
  }
  (function rec(t){
    out.push(t);
    if(t.S && !PRG_UI.colapsadas[t.u]) (PRG.hijos[t.u]||[]).forEach(rec);
  })(PRG.raiz);

function puntosCurvaS(){
  const ini = prgFecha(PRG.inicio), fin = prgFecha(PRG.fin), pts = [];
  const d = new Date(ini); d.setDate(d.getDate() - d.getDay() + 1); /* lunes */
  while(d <= fin){ const iso = prgISO(d); pts.push({ fecha:iso, plan:totalPlan(iso) }); d.setDate(d.getDate() + 7); }
  pts.push({ fecha:prgISO(fin), plan:100 });
  return pts;
}
function svgCurvaS(){
  const pts = puntosCurvaS(), w = 720, hh = 300, ml = 44, mr = 16, mt = 16, mb = 40;
  const x0 = prgMs(pts[0].fecha), x1 = prgMs(pts[pts.length-1].fecha);
  const X = function(iso){ return ml + (prgMs(iso) - x0) / (x1 - x0) * (w - ml - mr); };
  const Y = function(p){ return mt + (100 - p) / 100 * (hh - mt - mb); };
  let s = '<svg class="chart" viewBox="0 0 ' + w + ' ' + hh + '" style="max-width:100%" role="img" aria-label="Curva S plan vs real">';
  for(let g = 0; g <= 100; g += 25){ s += '<line x1="' + ml + '" x2="' + (w - mr) + '" y1="' + Y(g) + '" y2="' + Y(g) + '" stroke="var(--border)" stroke-width="1"/><text x="' + (ml - 6) + '" y="' + (Y(g) + 4) + '" text-anchor="end" font-size="11" fill="var(--text-3)">' + g + '%</text>'; }
  const M = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const ini = prgFecha(pts[0].fecha);
  for(let d = new Date(ini.getFullYear(), ini.getMonth(), 1); d.getTime() <= x1; d.setMonth(d.getMonth() + 1)){
    if(d.getTime() < x0) continue; const xx = X(prgISO(d));
    s += '<line x1="' + xx + '" x2="' + xx + '" y1="' + mt + '" y2="' + (hh - mb) + '" stroke="var(--border)" stroke-dasharray="2 3"/><text x="' + xx + '" y="' + (hh - mb + 16) + '" text-anchor="middle" font-size="10.5" fill="var(--text-3)">' + M[d.getMonth()] + (d.getMonth() === 0 || d.getTime() === new Date(ini.getFullYear(), ini.getMonth(), 1).getTime() ? ' ' + String(d.getFullYear()).slice(2) : '') + '</text>';
  }
  s += '<path d="' + pts.map(function(p, i){ return (i ? 'L' : 'M') + X(p.fecha).toFixed(1) + ' ' + Y(p.plan).toFixed(1); }).join(' ') + '" fill="none" stroke="#17658d" stroke-width="2.5"/>';
  const cortes = Object.keys(DB.programa.cortes).sort().map(function(f){ return { fecha:f, real:Number(DB.programa.cortes[f]) || 0 }; });
  const corte = fechaCorte(), realHoy = totalReal();
  const serie = cortes.filter(function(c){ return c.fecha < corte; }).concat([{ fecha:corte, real:realHoy }]);
  if(serie.length){
    s += '<path d="' + serie.map(function(p, i){ return (i ? 'L' : 'M') + X(p.fecha).toFixed(1) + ' ' + Y(p.real).toFixed(1); }).join(' ') + '" fill="none" stroke="#25703c" stroke-width="2.5"/>';
    serie.forEach(function(p){ s += '<circle cx="' + X(p.fecha) + '" cy="' + Y(p.real) + '" r="3.5" fill="#25703c"/>'; });
  }
  const xc = X(corte);
  s += '<line x1="' + xc + '" x2="' + xc + '" y1="' + mt + '" y2="' + (hh - mb) + '" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="4 3"/>' +
       '<text x="' + (xc + 4) + '" y="' + (mt + 12) + '" font-size="11" fill="var(--bad)">corte ' + fmtFecha(corte) + '</text>';
  s += '<text x="' + (w - mr) + '" y="' + (Y(totalPlan(corte)) - 6) + '" text-anchor="end" font-size="11" fill="#17658d">plan ' + totalPlan(corte) + ' %</text>';
  s += '<text x="' + (w - mr) + '" y="' + (Y(realHoy) + 14) + '" text-anchor="end" font-size="11" fill="#25703c">real ' + realHoy + ' %</text>';
  s += '</svg>';
  return s;
}

/* Paleta de series para gráficos (coherente con la paleta de la app) */
const SERIE = ['#12507e','#2f8f83','#9a6205','#6b4fa0','#b3261e','#2e7d46','#5b6672','#a8562a','#1a6ba8'];

function kpi(label, valor, nota, cls){
  return '<div class="card kpi ' + (cls || '') + '">' +
    '<div class="k-lab">' + esc(label) + '</div>' +
    '<div class="k-val">' + valor + '</div>' +
    (nota ? '<div class="k-note">' + esc(nota) + '</div>' : '') + '</div>';
}

/* --- Agrupaciones --- */
function agrupar(lista, fn){
  const m = {};
  lista.forEach(function(x){ const k = fn(x) || '—'; m[k] = (m[k] || 0) + 1; });
  return m;
}

/* --- Gráfico de barras horizontales --- */
function barrasH(mapa, opciones){
  opciones = opciones || {};
  const claves = Object.keys(mapa).filter(function(k){ return mapa[k] > 0 || opciones.mostrarCeros; });
  if(!claves.length) return '<div class="empty-state">Sin datos suficientes.</div>';
  claves.sort(function(a,b){ return mapa[b] - mapa[a]; });

  const max = Math.max.apply(null, claves.map(function(k){ return mapa[k]; })) || 1;
  const filaH = 26, gap = 6, labW = 172, padR = 46;
  const w = 560, h = claves.length * (filaH + gap) + 6;
  let s = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + attr(opciones.titulo || 'Gráfico de barras') + '">';
  claves.forEach(function(k, i){
    const y = i * (filaH + gap);
    const ancho = Math.max(2, (w - labW - padR) * (mapa[k] / max));
    const color = opciones.colores && opciones.colores[k] ? opciones.colores[k] : SERIE[i % SERIE.length];
    s += '<text x="0" y="' + (y + filaH/2 + 4) + '" font-size="11.5" fill="var(--text-2)">' + esc(recorta(k, 26)) + '</text>';
    s += '<rect x="' + labW + '" y="' + y + '" width="' + (w - labW - padR) + '" height="' + filaH + '" rx="4" fill="var(--surface-2)"/>';
    s += '<rect x="' + labW + '" y="' + y + '" width="' + ancho + '" height="' + filaH + '" rx="4" fill="' + color + '"/>';
    s += '<text x="' + (w - padR + 8) + '" y="' + (y + filaH/2 + 4) + '" font-size="11.5" font-weight="600" fill="var(--text)">' +
         esc(opciones.formato ? opciones.formato(mapa[k]) : mapa[k]) + '</text>';
  });
  return s + '</svg>';
}

/* --- Gráfico de dona --- */
function dona(mapa, colores){
  const claves = Object.keys(mapa).filter(function(k){ return mapa[k] > 0; });
  const total = claves.reduce(function(a,k){ return a + mapa[k]; }, 0);
  if(!total) return '<div class="empty-state">Sin datos suficientes.</div>';

  const cx = 110, cy = 110, rExt = 96, rInt = 58;
  let ang = -Math.PI/2, s = '<svg class="chart" viewBox="0 0 220 220" style="max-width:240px;margin:0 auto" role="img" aria-label="Distribución por estado">';
  claves.forEach(function(k, i){
    const frac = mapa[k] / total;
    const a2 = ang + frac * Math.PI * 2;
    const grande = frac > 0.5 ? 1 : 0;
    const color = (colores && colores[k]) || SERIE[i % SERIE.length];
    if(frac >= 0.9999){
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((rExt+rInt)/2) + '" fill="none" stroke="' + color + '" stroke-width="' + (rExt-rInt) + '"/>';
    }else{
      const x1 = cx + rExt*Math.cos(ang),  y1 = cy + rExt*Math.sin(ang);
      const x2 = cx + rExt*Math.cos(a2),   y2 = cy + rExt*Math.sin(a2);
      const x3 = cx + rInt*Math.cos(a2),   y3 = cy + rInt*Math.sin(a2);
      const x4 = cx + rInt*Math.cos(ang),  y4 = cy + rInt*Math.sin(ang);
      s += '<path d="M' + x1.toFixed(2) + ' ' + y1.toFixed(2) +
           ' A' + rExt + ' ' + rExt + ' 0 ' + grande + ' 1 ' + x2.toFixed(2) + ' ' + y2.toFixed(2) +
           ' L' + x3.toFixed(2) + ' ' + y3.toFixed(2) +
           ' A' + rInt + ' ' + rInt + ' 0 ' + grande + ' 0 ' + x4.toFixed(2) + ' ' + y4.toFixed(2) + ' Z" fill="' + color + '"/>';
    }
    ang = a2;
  });
  s += '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" font-size="26" font-weight="650" fill="var(--text)">' + total + '</text>';
  s += '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="11" fill="var(--text-2)">documentos</text>';
  s += '</svg>';

  s += '<div class="legend">' + claves.map(function(k, i){
    const color = (colores && colores[k]) || SERIE[i % SERIE.length];
    return '<span><i style="background:' + color + '"></i>' + esc(k) + ' · <b>' + mapa[k] + '</b> (' +
           Math.round(mapa[k]/total*100) + '%)</span>';
  }).join('') + '</div>';
  return s;
}

/* --- Curva acumulada de recepción por mes --- */
function curvaAcumulada(){
  const porMes = {};
  DB.documentos.forEach(function(d){
    d.revisiones.forEach(function(r){
      if(!r.fechaRecepcion) return;
      const k = r.fechaRecepcion.slice(0,7);
      porMes[k] = (porMes[k] || 0) + 1;
    });
  });
  const meses = Object.keys(porMes).sort();
  if(meses.length < 2) return '<div class="empty-state">Se necesitan al menos dos meses con recepciones para trazar la curva.</div>';

  let acum = 0;
  const puntos = meses.map(function(m){ acum += porMes[m]; return { mes:m, mensual:porMes[m], acum:acum }; });
  const max = acum;

  const w = 620, h = 240, padL = 40, padR = 14, padT = 14, padB = 34;
  const gw = w - padL - padR, gh = h - padT - padB;
  const x = function(i){ return padL + (puntos.length === 1 ? gw/2 : gw * i / (puntos.length - 1)); };
  const y = function(v){ return padT + gh - gh * (v / max); };

  let s = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Curva acumulada de recepción de documentos">';
  /* grilla horizontal */
  for(let g=0; g<=4; g++){
    const v = max * g / 4, yy = y(v);
    s += '<line x1="' + padL + '" y1="' + yy.toFixed(1) + '" x2="' + (w-padR) + '" y2="' + yy.toFixed(1) + '" stroke="var(--border)" stroke-width="1"/>';
    s += '<text x="' + (padL-6) + '" y="' + (yy+4).toFixed(1) + '" text-anchor="end" font-size="10.5" fill="var(--text-3)">' + Math.round(v) + '</text>';
  }
  /* barras mensuales */
  const bw = Math.min(26, gw / puntos.length * 0.5);
  puntos.forEach(function(p, i){
    const hh = gh * (p.mensual / max);
    s += '<rect x="' + (x(i) - bw/2).toFixed(1) + '" y="' + (padT + gh - hh).toFixed(1) + '" width="' + bw.toFixed(1) +
         '" height="' + Math.max(1, hh).toFixed(1) + '" rx="2" fill="var(--surface-3)"><title>' +
         esc(mesEtiqueta(p.mes + '-01')) + ': ' + p.mensual + ' recepción(es)</title></rect>';
  });
  /* línea acumulada */
  const d = puntos.map(function(p,i){ return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.acum).toFixed(1); }).join(' ');
  s += '<path d="' + d + '" fill="none" stroke="' + SERIE[0] + '" stroke-width="2.4" stroke-linejoin="round"/>';
  puntos.forEach(function(p,i){
    s += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.acum).toFixed(1) + '" r="3.6" fill="var(--surface)" stroke="' + SERIE[0] + '" stroke-width="2"><title>' +
         esc(mesEtiqueta(p.mes + '-01')) + ': ' + p.acum + ' acumulado(s)</title></circle>';
    s += '<text x="' + x(i).toFixed(1) + '" y="' + (h - 10) + '" text-anchor="middle" font-size="10.5" fill="var(--text-3)">' +
         esc(mesEtiqueta(p.mes + '-01')) + '</text>';
  });
  s += '</svg>';
  s += '<div class="legend"><span><i style="background:' + SERIE[0] + '"></i>Acumulado de recepciones</span>' +
       '<span><i style="background:var(--surface-3)"></i>Recepciones del mes</span></div>';
  return s;
}

/* --- Tiempo promedio de revisión por disciplina --- */
function promedioPorDisciplina(){
  const suma = {}, cuenta = {};
  DB.documentos.forEach(function(d){
    d.revisiones.forEach(function(r){
      if(!r.fechaRecepcion || !r.fechaRespuesta) return;
      const dd = dias(r.fechaRecepcion, r.fechaRespuesta);
      if(dd == null) return;
      suma[d.disciplina]   = (suma[d.disciplina]   || 0) + dd;
      cuenta[d.disciplina] = (cuenta[d.disciplina] || 0) + 1;
    });
  });
  const prom = {};
  Object.keys(suma).forEach(function(k){ prom[k] = Math.round(suma[k] / cuenta[k] * 10) / 10; });
  return prom;
}

    '<div style="background:var(--surface-2);border-radius:6px;height:22px;overflow:hidden;position:relative">' +

  html += '<div class="grid cols2" style="margin-bottom:16px">' +

    '<div class="card card-pad"><h2>Distribución por estado de revisión</h2>' + dona(porEstado, coloresEstado) + '</div>' +
  '</div>';

  /* curva acumulada */
  html += '<div class="card card-pad" style="margin-bottom:16px">' +
    '<h2>Curva acumulada de recepción de documentos</h2>' +
    '<p class="sub" style="margin-bottom:8px">Considera todas las revisiones recibidas, no solo la vigente.</p>' +
    curvaAcumulada() + '</div>';

  /* tiempos de revisión */
  const prom = promedioPorDisciplina();

  html += '<div class="card card-pad">' +
    '<h2>Tiempo promedio de revisión por disciplina</h2>' +

    '. Solo considera revisiones ya respondidas. Plazo comprometido: <b>' + DB.params.plazoRevisionDias + ' días</b>.</p>' +
    barrasH(prom, { formato: function(v){ return v + ' d'; },
                    colores: (function(){ const c = {}; Object.keys(prom).forEach(function(k){
                      c[k] = prom[k] > DB.params.plazoRevisionDias ? '#b3261e' : '#2e7d46'; }); return c; })() }) +
  '</div>';

  return html;
}

  if(!discrep.length){ html += '<p class="sub" style="margin:0">Sin discrepancias abiertas entre ingeniería y terreno.</p>'; }
  else{
    html += '<div class="tbl-wrap"><table><thead><tr><th style="cursor:default">Código</th><th style="cursor:default">Área</th>' +
            '<th style="cursor:default">RFI</th><th style="cursor:default">Sin resolver</th><th style="cursor:default"></th></tr></thead><tbody>';
    discrep.forEach(function(d){
      const ab = d.terreno.discrepancias.filter(function(x){ return !x.resuelta; }).length;
      html += '<tr><td><span class="mono">' + esc(d.codigo) + '</span></td><td>' + esc(d.area || '—') + '</td>' +
              '<td><span class="mono">' + esc(d.terreno.rfiNumero || '—') + '</span></td>' +
              '<td>' + pill('bad', ab) + '</td>' +
              '<td><button class="btn sm" onclick="verTerreno(\'' + d.id + '\')">Gestionar</button></td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  html += '<div class="card card-pad"><h2>Últimas recepciones</h2>';
  const ultimos = docs.slice().sort(function(a,b){
    return str(revActual(b).fechaRecepcion).localeCompare(str(revActual(a).fechaRecepcion));
  }).slice(0, 6);
  if(!ultimos.length){ html += '<p class="sub" style="margin:0">Todavía no hay documentos registrados.</p>'; }
  else{
    html += '<div class="tbl-wrap"><table><thead><tr><th style="cursor:default">Fecha</th><th style="cursor:default">Código</th>' +
            '<th style="cursor:default">Rev.</th><th style="cursor:default">Estado</th></tr></thead><tbody>';
    ultimos.forEach(function(d){
      const r = revActual(d);
      html += '<tr><td>' + fmtFecha(r.fechaRecepcion) + '</td><td><span class="mono">' + esc(d.codigo) + '</span></td>' +
              '<td>' + esc(r.rev) + '</td><td>' + pillEstado(r.estado) + '</td></tr>';
    });
    html += '</tbody></table></div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function guardarContrato(){
  DB.contrato = {
    proyecto: valorCampo('cProyecto'), mandante: valorCampo('cMandante'), contratista: valorCampo('cContratista'),
    nContrato: valorCampo('cNContrato'), ods: valorCampo('cOds'),
    fechaInicio: valorCampo('cIni'), fechaTermino: valorCampo('cTer'),
    adminContrato: valorCampo('cAdmin'), jefeOT: valorCampo('cJefeOT'), jefeCalidad: valorCampo('cJefeCal'),
    carpetaDrive: valorCampo('cDrive'),
    carpetaCalidad: valorCampo('cCalidad'),
    servicioCalidad: valorCampo('cServCal')
  };
  CALIDAD.arbol = null;
  if(DB.contrato.fechaInicio && DB.contrato.fechaTermino && DB.contrato.fechaTermino < DB.contrato.fechaInicio){
    toast('La fecha de término no puede ser anterior a la de inicio.', 'bad'); return;
  }
  guardarDB(); render(); toast('Datos del contrato guardados.', 'ok');
}
function guardarParams(){
  const plazo = Number(valorCampo('pPlazo'));
  if(!plazo || plazo < 1){ toast('El plazo debe ser un número mayor que cero.', 'bad'); return; }
  DB.params.plazoRevisionDias = plazo;
  DB.params.usarDiasHabiles = valorCampo('pHabiles') === '1';
  guardarDB(); render(); toast('Parámetros guardados.', 'ok');
}
function recargarBase(){
  confirmar('Recargar documentación base',
    '<p>Se agregarán los documentos de la carpeta <b>Construccion</b> que aún no existan en la base (por código). ' +
    'Los documentos ya registrados, sus revisiones y comentarios se conservan.</p>',
    function(){
      const base = documentacionBase();
      let n = 0;
      base.forEach(function(b){
        if(DB.documentos.some(function(d){ return d.codigo.toLowerCase() === b.codigo.toLowerCase(); })) return;
        b.correlativo = DB.correlativo++; DB.documentos.push(b); n++;
      });
      guardarDB(); render(); toast(n + ' documento(s) agregado(s) desde la base del contrato.', 'ok');
    }, 'Recargar');
}
function limpiarEjemplo(){
  confirmar('Vaciar todos los documentos',
    '<p>Se eliminarán <b>todos los documentos</b> de la matriz y quedará la base vacía. ' +
    'Los datos de cabecera y los parámetros se conservan. Puede volver a cargar la documentación base desde este mismo panel.</p>',
    function(){
      DB.documentos = []; DB.correlativo = 1; ESTADO_UI.docSel = null;
      guardarDB(); render(); toast('Base vacía.', 'ok');
    }, 'Limpiar');
}
function borrarTodo(){
  confirmar('Reiniciar toda la base',
    '<p>Se borrarán los documentos <b>y</b> los datos de cabecera del contrato, volviendo al estado inicial con ' +
    'la documentación base de la carpeta Construccion. Exporte antes un respaldo JSON si necesita conservar la información.</p>',
    function(){
      try{ localStorage.removeItem(APP.storageKey); }catch(e){}
      DB = dbVacia(); DB.documentos = datosDeEjemplo(); DB.correlativo = DB.documentos.length + 1;
      ESTADO_UI.docSel = null;
      guardarDB(); render(); toast('Base reiniciada.', 'ok');
    }, 'Borrar todo');
}

/* ==================================================================
   ==========        CÓMO AGREGAR UN MÓDULO NUEVO          ==========
   ==================================================================

   La aplicación está armada para crecer por etapas. Para incorporar
   uno de los módulos 02 a 08 (o uno nuevo) basta con dos pasos:

   PASO 1 — Declararlo en el menú
   ------------------------------
   En la sección CONFIGURACIÓN, edite el arreglo MENU. Cada módulo es
   un objeto con esta forma:

     {
       id:    'calidad',                  // identificador único
       code:  '02',                       // número que se muestra
       label: 'Calidad (PIE / ITP)',      // nombre visible
       icon:  'folder',                   // 'folder' | 'chart' | 'gear' | 'book'
       route: 'calidad',                  // ruta del hash: #/calidad
       render:'renderCalidad'             // nombre de la función de vista
     }

   Si el módulo tiene submódulos, agregue el arreglo children con la
   misma forma (sin code):

     children: [
       { id:'pie', label:'2.1 Matriz PIE', route:'calidad/pie', render:'renderPIE' }
     ]

   Mientras el módulo no esté desarrollado, en lugar de render use:

     wip: true,
     wipDesc:  'Descripción breve de lo que contendrá.',
     wipItems: ['Alcance 1','Alcance 2']

   y la aplicación mostrará automáticamente la tarjeta "En construcción".

   PASO 2 — Escribir la función de vista
   -------------------------------------
   Agregue en la sección VISTAS una función global con el nombre que
   puso en render. Debe DEVOLVER el HTML de la vista (no escribirlo):

     function renderCalidad(){
       return '<div class="page-title"><h1>02 — Calidad</h1></div>' +
              '<div class="card card-pad">…</div>';
     }

   Si la vista necesita enlazar eventos después de pintarse (por
   ejemplo, escuchar un <select>), agregue además una función con el
   mismo nombre y el sufijo Post; el router la llama automáticamente:

     function renderCalidadPost(){
       document.getElementById('miSelect').addEventListener('change', …);
     }

   PASO 3 (solo si guarda datos nuevos)
   ------------------------------------
   a) Agregue el arreglo correspondiente en dbVacia(), por ejemplo
      protocolos: [].
   b) Normalícelo en normalizarDB() para que las bases antiguas o
      importadas no rompan la aplicación.
   c) Llame a guardarDB() después de cada cambio y a render() para
      repintar.

   COMPONENTES REUTILIZABLES DISPONIBLES
   -------------------------------------
     kpi(label, valor, nota, cls)        tarjeta KPI  (cls: good|warn|bad)
     pill(cls, texto)                    etiqueta de estado con punto
     pillEstado(idEstado)                etiqueta según ESTADOS_REV
     campo(id, label, control, ayuda)    campo de formulario con ayuda
     fila(clave, valor)                  fila de ficha (dentro de <dl class="dl">)
     abrirModal(html) / cerrarModal()    ventana modal
     confirmar(titulo, texto, fn, boton) confirmación antes de borrar
     toast(mensaje, 'ok'|'bad')          aviso flotante
     barrasH(mapa, opciones)             gráfico de barras horizontales
     dona(mapa, colores)                 gráfico de dona
     esc(texto) / attr(texto)            escapado seguro de HTML
     fmtFecha(iso)                       fecha en dd-mm-aaaa
     dias(desde, hasta)                  días hábiles o corridos según parámetros

   Clases CSS útiles: card, card-pad, grid kpis, grid cols2, toolbar,
   tbl-wrap + table, help, warnbox, badbox, empty-state, inp, btn,
   btn primary, btn danger, btn sm, tag, mono, num, sec, dl, pasos,
   details.acc (acordeón).

   ENLACES A ARCHIVOS
   ------------------
   refDoc('código', 'texto') devuelve un enlace que abre el PDF de un
   documento de la matriz (por su código) más el botón "ficha".
   enlaceDoc(doc) / abrirDocumento(id) resuelven la ruta: archivo de la
   revisión vigente → enlace general → enlace de Google Drive. Las rutas
   relativas se resuelven respecto de la carpeta donde está este HTML.

   ORDEN DE CARGA
   --------------
   El arranque (bloque "ARRANQUE") debe quedar siempre al final del
   archivo: las funciones de vista deben existir antes de render().
   ================================================================== */
</script>
